name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run when a PR branch gets a new push, but NEVER on
# main.
#
# A full matrix here is expensive — roughly 36 min ubuntu, 58 macOS, 87 Windows
# — so every superseded PR run burns over two hours of runner time verifying a
# tree nobody will merge. Two of those happened in a single afternoon before
# this was added.
#
# `cancel-in-progress` is deliberately an expression rather than `true`. A
# cancelled run on main is exactly how 3b521a72 reached main unverified, and it
# then caused three separate failures — an unformatted tree, a broken
# `AUTONOMY_RULE` assertion, and the capability-hoisting regression behind #163
# that made a 15-task workflow run produce one file. On main the run must always
# finish, however long it takes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  warnings:
    name: rust warnings denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check every Rust target without warnings
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --locked
      # audio-capture is a default feature, so the branch that reports "this
      # build has no microphone support" is otherwise never compiled — which is
      # how a fallback path rots into one that does not build (#192).
      - name: Check archon-tui builds without audio capture
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p archon-tui --no-default-features --locked

  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  source-lints:
    name: source lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.3.1
      - name: Select pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --component rustfmt --component clippy
      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev
      - uses: Swatinem/rust-cache@v2.8.2
        with:
          # Match the existing warnings job's automatic job-id cache prefix.
          shared-key: warnings
          save-if: false
        # Match dtolnay's cache environment without exporting homes to tests.
        env:
          CARGO_HOME: /home/runner/.cargo
          CARGO_INCREMENTAL: '0'
      # Issue 340's spawn lint, spawn-env lint and their scanner self-tests
      # live below spawn::lint_tests. This leaf has no production archon deps:
      # target ~5 min with rust-cache, without the root's 5600 tests. Its
      # dev-only archon-test-support -> archon-memory edge can cost more cold.
      # Other source scans live in heavier crates (core/tools/tui/workflow).
      # write/test_baseline_lint_tests.rs exercises baseline behaviour, not
      # source text, and workflow pulls archon-tools + tree-sitter + QuickJS.
      # Keep those in the full matrix rather than delaying this feedback path.
      - name: Run shell source lints
        shell: bash
        run: |
          cargo test -p archon-shell --lib --locked -- lint_tests 2>&1 | tee "$RUNNER_TEMP/source-lints.log"
          if ! grep -Eq 'running [1-9][0-9]* tests?' "$RUNNER_TEMP/source-lints.log"; then
            echo "::error::Shell source lint filter executed zero tests"
            exit 1
          fi

  # Build once per OS, then fan out execution (no test filters). PR #591,
  # run 41893591793: nextest compile/run was 25/18.5 min Linux, 33/38 macOS,
  # 39/55 Windows. Three shards amortise compilation; four on Windows reduce
  # its dominant execution phase from ~18 to ~14 min per shard. Standard
  # public runners are free. Separate needs edges avoid an all-OS build barrier.
  # YAML anchors keep all OS setup fixes shared (GitHub supports anchors).
  # https://nexte.st/docs/ci-features/partitioning/: hash:K/N assigns each test
  # to exactly one bucket; keep every K and never add a test-selection filter.
  build-ubuntu:
    name: build test archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Per-OS timeout (#237). Linux 90 min, macOS 135, Windows 180 (set per
    # matrix entry below). All raised 50% for slow runners: run 38139774216
    # cancelled Windows at 120 min with 17777/18193 tests done.
    #
    # #244 Windows CI, re-enabled. The BASH_FUNC_* env-var bug on the windows
    # runner image causes bash's CVE-2014-6271 Shellshock self-defense to abort
    # any `shell: bash` step with `::error::bash function injection ... is not
    # allowed for security reasons` (upstream actions/partner-runner-images#169,
    # still open). Rather than wait for the image fix, Windows simply never
    # touches bash:
    #
    #   * dtolnay/rust-toolchain is skipped — its composite steps are bash, and
    #     the Windows images ship rustup already. rust-toolchain.toml pins the
    #     version, and rustup installs it on the first cargo call, so the
    #     preinstalled toolchain is not the one that ends up being used anyway.
    #   * taiki-e/install-action is skipped for the same reason; nextest comes
    #     from its official prebuilt Windows archive.
    #   * every run step is split so Windows gets a pwsh variant.
    #
    # Keep it that way. A single unguarded `shell: bash` step, or one composite
    # action that uses bash internally, re-breaks the whole Windows job.
    timeout-minutes: ${{ matrix.timeout-override }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Measured job time: 33-38 min with a warm rust-cache, about
            # 48 min after a cache miss (Build workspace 754s instead of
            # ~120s; #243). Hung tests are already killed by nextest after
            # 4 x 60s (.config/nextest.toml), so this is only a backstop for
            # a stuck step and must clear the cold-cache time.
            # 60 -> 90: slow runners (Windows cancelled at 120 min, run 38139774216).
            timeout-override: 90
    steps: &build-steps
      - uses: actions/checkout@v4.3.1

      - &free-linux-disk
        name: Free disk space (Linux only)
        if: runner.os == 'Linux'
        # GitHub-hosted ubuntu-latest has ~14 GB free disk by default. A
        # 1000-rlib debug build + rust-cache restore can push this near
        # zero, and the linker's mmap'd intermediate writes then SIGBUS
        # on the largest test binaries (#236 voice_capture_events, after
        # #226 lld already cleared smoke_resolve_overflow). Remove the
        # pre-installed SDKs, toolcache and Docker images BEFORE cache restore.
        # Run 41893591793 added ~80 GB in test-profile output alone; leave
        # room on the root filesystem for the archive in RUNNER_TEMP too.
        run: |
          nproc
          df -h /
          ls -d /mnt || echo "no /mnt"
          findmnt /tmp || true
          sudo docker image prune --all --force
          # Keep system Node/npm, Python, Git, Docker and mold. Retain JVM/Gradle
          # for the opt-in Java tests; Linux PowerShell tests supply a fake pwsh.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/swift \
            /usr/share/swift /opt/swift /usr/local/.ghcup "$HOME/.ghcup" \
            /usr/share/az_* /opt/az /usr/local/share/chromium \
            /usr/local/share/powershell /usr/local/aws-cli /usr/local/aws-sam-cli \
            /opt/pipx /usr/share/miniconda /usr/local/julia* \
            /opt/microsoft /opt/google /usr/lib/google-cloud-sdk
          df -h /

      - &windows-host-disk
        name: Log Windows backing volume before Dev Drive creation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Get-Volume -FilePath "$env:RUNNER_TEMP\" | Format-List DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }

      - &windows-dev-drive
        name: Set up Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4.0.0
        with:
          # PR #591/run 41893591793: 39 min compiling nextest binaries plus
          # 7 min cargo build on Windows. Move compiler IO off NTFS. A dynamic
          # 150GB ceiling covers the ~80GB Linux test build plus
          # headroom; host free space is logged before creation on every job.
          drive-size: 150GB
          drive-type: Dynamic
          drive-path: ${{ runner.temp }}/archon-dev-drive.vhdx
          drive-format: ReFS
          # Identical mount paths on build/shards preserve env!(CARGO_BIN_EXE_*)
          # absolute paths. Keep RUNNER_TEMP itself on NTFS for the 8.3 probe.
          mount-path: ${{ runner.temp }}/archon-dev-drive
          # Only map a private path variable. Cargo/rustup homes retain the
          # runner defaults; --target-dir scopes build IO to the Dev Drive
          # without changing the Cargo environment inherited by tests.
          env-mapping: |
            ARCHON_TARGET_DIR,{{ DEV_DRIVE }}/target
          # PR #592/run 41919790038: archiving 746 test binaries took 16m on
          # Windows against 1m on macOS. Hypothesis: AV filters on the untrusted
          # Dev Drive. Trusted mode runs fsutil devdrv trust plus /disallowAv,
          # so no AV filter attaches. The action ignores fsutil exit codes:
          # read "fsutil devdrv query" in the step log to confirm trust.
          trusted-dev-drive: true

      - &posix-rust-toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        if: runner.os != 'Windows'
        with:
          toolchain: stable

      # Windows equivalent of the step above. dtolnay/rust-toolchain installs
      # via `shell: bash` composite steps, which the runner image's BASH_FUNC_*
      # env vars make impossible (#244). The image already ships rustup, and
      # rust-toolchain.toml pins the version, so rustup downloads and selects
      # the pinned toolchain explicitly from the checkout before using Cargo.
      - &windows-rust-toolchain
        name: Set up Rust (Windows, without bash)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches.Groups[1].Value
          if (!$toolchain) { throw 'Missing pinned Rust toolchain' }
          rustup toolchain install $toolchain --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          rustc --version

      # macOS-runner workaround: GitHub's macOS image pre-ships
      # `/usr/local/bin/cargo` as a rustup-init shim that intercepts
      # `cargo build` with `error: unexpected argument 'build' found`.
      # The prior GITHUB_PATH-prepend approach was flaky: GITHUB_PATH only
      # affects *subsequent* steps and intermittently lost the PATH race to
      # the runner's default ordering. Deleting the shim outright is
      # deterministic — PATH then resolves to the dtolnay-installed
      # `$HOME/.cargo/bin/cargo` with no cross-step race. Safe on ephemeral
      # GH runners (passwordless sudo; runner discarded post-job).
      - &macos-rust-shims
        name: Select usable rustup and remove macOS tool shims
        if: runner.os == 'macOS'
        shell: bash
        run: |
          candidates=()
          candidate_versions=()
          rustup_path=""

          add_candidate() {
            local candidate="$1" version index
            [[ -x "$candidate" ]] || return 0
            for index in "${!candidates[@]}"; do
              [[ "${candidates[$index]}" == "$candidate" ]] && return 0
            done
            version="$("$candidate" --version 2>/dev/null || true)"
            candidates+=("$candidate")
            candidate_versions+=("$version")
            if [[ -z "$rustup_path" && "$version" =~ ^rustup\ [0-9] ]]; then
              rustup_path="$candidate"
            fi
          }

          add_candidate "$HOME/.cargo/bin/rustup"
          IFS=: read -r -a path_dirs <<< "$PATH"
          for path_dir in "${path_dirs[@]}"; do
            [[ -n "$path_dir" ]] || path_dir="."
            add_candidate "$path_dir/rustup"
          done

          if [[ -z "$rustup_path" ]]; then
            printf 'No usable rustup found. Candidates checked:\n' >&2
            for index in "${!candidates[@]}"; do
              printf '  %s: %s\n' "${candidates[$index]}" "${candidate_versions[$index]:-<no version output>}" >&2
            done
            exit 1
          fi

          rustup_real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$rustup_path")"
          for file in /usr/local/bin/cargo /usr/local/bin/rustc; do
            [[ -e "$file" || -L "$file" ]] || continue
            version="$("$file" --version 2>/dev/null || true)"
            command_name="${file##*/}"
            if [[ ! "$version" =~ ^${command_name}\  ]]; then
              sudo rm -f "$file"
            fi
          done

          file=/usr/local/bin/rustup
          if [[ -e "$file" || -L "$file" ]]; then
            version="$("$file" --version 2>/dev/null || true)"
            file_real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$file")"
            if [[ ! "$version" =~ ^rustup\ [0-9] && "$file_real" != "$rustup_real" ]]; then
              sudo rm -f "$file"
            fi
          fi

          rustup_dir="$(dirname "$rustup_path")"
          echo "$rustup_dir" >> "$GITHUB_PATH"
          export PATH="$rustup_dir:$PATH"
          rustup default stable
          command -v cargo
          cargo --version
          rustup --version

      - &linux-system-deps
        name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev

      - &linux-mold
        name: Install mold linker (faster + lower memory than lld for large workspaces)
        if: runner.os == 'Linux'
        # Fourth remediation for #236 ubuntu link-time SIGBUS:
        #   #220 [profile.test] tweaks: didn't help
        #   #225 cargo-nextest migration: didn't help (linker memory unchanged)
        #   #226 lld swap: cleared smoke_resolve_overflow but voice_capture_events
        #         still SIGBUS on commit 855977d
        #   #236 (this): mold + free-disk. mold is faster + lower-memory than
        #         lld for large workspaces; available in standard ubuntu repos.
        # Drop-in via the same `-fuse-ld=` mechanism. If mold install fails,
        # apt-get -y will fail noisily, halting the job and surfacing the
        # regression rather than silently degrading.
        run: |
          sudo apt-get install -y mold
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - &posix-cache-target
        name: Select cache target path (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CARGO_CACHE_TARGET=target" >> "$GITHUB_ENV"

      - &windows-cache-target
        name: Select cache target path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $relative = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $env:ARCHON_TARGET_DIR)
          if ([System.IO.Path]::IsPathRooted($relative)) {
            throw 'rust-cache requires the workspace and Dev Drive mount on the same volume'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_CACHE_TARGET=$relative"

      - uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: ci-${{ matrix.os }}
          # rust-cache joins this path to the workspace (absolute paths are
          # not supported). Cargo home keeps the runner's original location.
          workspaces: ". -> ${{ env.CARGO_CACHE_TARGET }}"
          # Without this the cache is only saved on success, so a job that runs
          # out of wall-clock saves nothing and the next attempt starts cold —
          # which on Windows is most of the budget gone before a test runs.
          cache-on-failure: true

      # Pin nextest too: producer and every consumer must agree on archive
      # metadata, runtime CARGO_BIN_EXE_* support and the hash partitioner.
      - &install-nextest
        name: Install cargo-nextest
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@v2.89.1
        with:
          tool: nextest@0.9.138

      # taiki-e/install-action is also a bash composite, so Windows uses
      # nextest's own prebuilt archive instead. get.nexte.st serves a zip for
      # this target; unpacking it into the cargo bin directory puts it on PATH
      # for later steps. Prepend that same bin directory explicitly.
      - &install-nextest-windows
        name: Install cargo-nextest (Windows, without bash)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\.cargo\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri 'https://get.nexte.st/0.9.138/windows' -OutFile "$env:RUNNER_TEMP\nextest.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\nextest.zip" -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          & "$dest\cargo-nextest.exe" nextest --version

      - name: Build workspace
        if: runner.os != 'Windows'
        shell: bash
        # Keep normal cargo diagnostics for real compiler failures, but avoid
        # `--verbose`: it emits every rustc invocation and can fill the
        # ubuntu runner log/disk before nextest gets to report failures.
        run: |
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          cargo build --workspace
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true

      - name: Build workspace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          cargo build --workspace --target-dir "$env:ARCHON_TARGET_DIR"
          $status = $LASTEXITCODE
          try { Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          exit $status

      - name: Windows Issue 92 process evidence
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: "1"
          ISSUE92_FORBIDDEN: "must-not-reach-hooks"
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            @{ Package = 'archon-core'; Target = @('--lib'); Name = 'windows_hook_output_has_a_shared_bound_and_reports_truncation' },
            @{ Package = 'archon-core'; Target = @('--lib'); Name = 'windows_hook_uses_isolated_environment_and_explicit_context' },
            @{ Package = 'archon-core'; Target = @('--lib'); Name = 'windows_hook_timeout_kills_descendant_process' },
            @{ Package = 'archon-core'; Target = @('--lib'); Name = 'windows_hook_waits_for_descendant_after_parent_exits' },
            @{ Package = 'archon-core'; Target = @('--lib'); Name = 'windows_hook_process_exists_reports_existing_and_absent_processes' },
            @{ Package = 'archon-tools'; Target = @('--lib'); Name = 'windows_timeout_kills_background_descendant' },
            @{ Package = 'archon-tools'; Target = @('--lib'); Name = 'windows_bash_waits_for_descendant_after_parent_exits' },
            @{ Package = 'archon-tools'; Target = @('--lib'); Name = 'windows_bash_process_exists_reports_existing_and_absent_processes' },
            @{ Package = 'archon-pipeline'; Target = @('--test', 'forbidden_pattern_scanner'); Name = 'windows_and_mixed_separator_test_paths_are_exempt' }
          )
          $failures = @()
          foreach ($test in $tests) {
            Write-Host "START Issue #92 test: $($test.Name)"
            & cargo test --target-dir "$env:ARCHON_TARGET_DIR" -p $test.Package @($test.Target) $test.Name -- --test-threads=1 2>&1 |
              Tee-Object -Variable output |
              Write-Host
            if ($LASTEXITCODE -ne 0) {
              $failures += $test.Name
              Write-Host "FAILED Issue #92 test: $($test.Name)"
              continue
            }
            if (($output | Out-String) -notmatch 'running 1 test') {
              throw "Issue #92 test did not run: $($test.Name)"
            }
            Write-Host "END Issue #92 test: $($test.Name)"
          }
          if ($failures.Count -gt 0) {
            throw "Issue #92 tests failed: $($failures -join ', ')"
          }

      - name: Build nextest archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
          # 32 MiB per test thread. libtest runs every test on a thread whose
          # stack defaults to 2 MiB, and tokio's blocking pool — where
          # `WorkflowV2ScriptRunner::run` hosts the script runtime — inherits
          # the same default. In a debug build the v3 live runner's poll
          # frames no longer fit: eight bin tests (`workflow_live_v2_
          # lifecycle_e2e_tests_{b,e}`, `workflow_live_v2_blocking_gap_tests`,
          # the canary regressions, `declared_output_tests`) passed at
          # d79f930bc and aborted with SIGABRT at 6294791c9 with no change to
          # the tests. The one outsized frame — `LiveAgentDispatch::run_call`
          # carrying four copies of the live call future, 1.3-1.5 MiB under
          # lldb — is boxed at the source; what remains is the read-only
          # fan-out path of the decomposed lifecycle, a stack of 30-430 KiB
          # frames that measured between 2 and 3 MiB (fails at 2, passes at
          # 3). The env var is the standard remedy for large debug futures; it
          # reserves address space, not memory, and child test processes
          # inherit it. Same family as the Windows main-thread bump in
          # `.cargo/config.toml`.
          RUST_MIN_STACK: "33554432"
        # nextest runs each test binary in its own process and serialises
        # build+link via CARGO_BUILD_JOBS=1, which keeps peak link memory
        # within ubuntu-latest's 7GB RAM ceiling and unblocks #225 SIGBUS
        # on the smoke_resolve_overflow link.
        #
        # NOTE on test parallelism (#233):
        # No --test-threads flag here on purpose. nextest defaults to
        # num_cpus, which is fine on GitHub-hosted runners (ubuntu/macos:
        # 4 cores + 16GB RAM, windows: 4 cores + 16GB RAM).
        #
        # The project's WSL2 dev box rule "cargo test MUST use
        # --test-threads=2" applies to LOCAL developer invocations only
        # (small RAM, prior crash incidents on parallel rustc/test
        # binaries). It does NOT apply to CI runners. Forcing
        # --test-threads=1 here previously timed out the ubuntu test step
        # at 64+ minutes (commit 3fded2c). Job timeout-minutes still bounds
        # future regressions while allowing current workspace tests to finish.
        # Emit a heartbeat so GitHub does not kill long, quiet nextest
        # phases as an apparent no-output hang, and include disk snapshots so
        # runner-capacity failures remain diagnosable without verbose rustc
        # command logs.
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-artifact"
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          cargo nextest archive --workspace --archive-file "$RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst" &
          nextest_pid=$!
          while kill -0 "$nextest_pid" 2>/dev/null; do
            sleep 60
            echo "nextest still running..."
            df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          done
          status=0
          wait "$nextest_pid" || status=$?
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          if [[ -f "$RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst" ]]; then
            ls -lh "$RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst"
            wc -c < "$RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst"
          fi
          exit "$status"

      - name: Build nextest archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Same reason as the POSIX step above: the archon bin's workflow
          # live-runner tests overflow libtest's 2 MiB test-thread stack.
          RUST_MIN_STACK: "33554432"
        # Deliberately NOT setting CARGO_BUILD_JOBS=1, unlike the POSIX step.
        # That exists to keep peak link memory inside ubuntu-latest's 7GB
        # ceiling (#225 SIGBUS). Windows runners have 16GB and a different
        # linker, so the setting buys nothing there and costs enormously:
        # nextest links ~200 test binaries, and serialising MSVC linking is why
        # run 30697135157 spent ~100 minutes in this step and was cancelled at
        # the 2h wall, against 8 minutes for the same suite on macOS.
        #
        # No heartbeat loop either: that exists on the POSIX side to keep long
        # quiet phases diagnosable alongside disk snapshots, and reproducing
        # bash job control in pwsh would buy nothing. Execution and its
        # --no-fail-fast policy live in the shard job below.
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/nextest-artifact" | Out-Null
          try { Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          cargo nextest archive --workspace --target-dir "$env:ARCHON_TARGET_DIR" --archive-file "$env:RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst"
          $status = $LASTEXITCODE
          try { Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          try { Get-Volume -FilePath "$env:ARCHON_TARGET_DIR\" | Format-List DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          Get-Item "$env:RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst" | Select-Object FullName, Length
          exit $status

      # https://nexte.st/docs/ci-features/archiving/: archives contain test
      # binaries, integration-test executables, dylibs and workspace OUT_DIRs
      # (one level deep). Our generated archon_env_vars.rs is a direct OUT_DIR
      # child and compiled in; fixtures/source come from the same-ref checkout.
      # env!(CARGO_MANIFEST_DIR)/env!(CARGO_BIN_EXE_archon) occur throughout the
      # tests, so remapping alone is insufficient: assert identical paths and
      # extract into the original target location on every shard as well.
      # Archives have a literal target/ prefix, so --extract-to is its PARENT,
      # not the target directory itself. No extra archive.include paths are needed.
      - name: Record archive paths (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target" > "$RUNNER_TEMP/nextest-artifact/paths.txt"

      - name: Record archive paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @($env:GITHUB_WORKSPACE, $env:ARCHON_TARGET_DIR) | Set-Content "$env:RUNNER_TEMP/nextest-artifact/paths.txt"

      - name: Upload nextest archive
        uses: actions/upload-artifact@v7.0.2
        with:
          # archive:false ignores name and uses the filename as artifact name.
          path: ${{ runner.temp }}/nextest-artifact/nextest-${{ matrix.os }}.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 3

      - name: Upload archive path assertions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextest-paths-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest-artifact/paths.txt
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: build test archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-override }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # macOS runners are noticeably slower than ubuntu for this
            # workspace: no mold linker, slower disk, and `cargo nextest
            # run --workspace` finishes in ~28.5 of the budget on its own
            # — leaving doc tests + sccache upload to push the job over
            # 30 min and trigger a wall-clock cancel. Verified on the
            # 5564ab8 CI run where all 5864 tests passed at 10:06:46Z and
            # the operation was canceled at 10:08:10Z mid-sccache upload.
            # Bumped to 45 to give headroom for the post-test phases.
            #
            # 45 is no longer enough. That figure was set against a 5864-test
            # suite; the workspace now runs 11246. Measured on run
            # 31384583601:
            #
            #   cold cache  cancelled at 46m14s, mid-nextest at test
            #               8080/11246 with every test to that point passing
            #   warm cache  35m11s for the same job — 78% of a 45 min budget
            #               with nothing gone wrong
            #
            # This was masked until now: the docs schema race (fixed in
            # b23baabe4) aborted the run early, so the preceding macOS jobs
            # "finished" in 33-40 min having never reached the end of the
            # suite. Fixing it is what first ran all 11246 tests here.
            #
            # 90 for the same reason Windows was on 120 — enough for one cold
            # cache to get through the whole phase. Tune down once a few warm
            # runs establish the real figure.
            # 90 -> 135: slow runners (Windows cancelled at 120 min, run 38139774216).
            timeout-override: 135
    steps: *build-steps

  build-windows:
    name: build test archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-override }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Windows has no mold and links with MSVC link.exe, which dominates
            # a workspace producing ~200 test binaries. (Vendored OpenSSL is
            # NOT a Windows-specific cost -- `openssl` is pinned with the
            # `vendored` feature untargeted, and the Linux job installs perl to
            # build it too. An earlier version of this comment claimed
            # otherwise.)
            #
            # 60 min was not enough: run 30695094906 built the workspace
            # successfully and was then cancelled mid-nextest at exactly
            # 60m07s, with macOS finishing the same job in 30m36s. Raised to
            # 120 so a cold cache can get through the test phase at least once;
            # tune back down once a warm-cache run shows the real figure.
            # 120 -> 180: run 38139774216 was cancelled at 120 min with
            # 17777/18193 tests done on a slow runner (last green: ~70 min).
            timeout-override: 180
    steps: *build-steps

  test-ubuntu:
    name: build + test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [build-ubuntu]
    runs-on: ${{ matrix.os }}
    # The test step measures 13-15 min (archive extract 5-8 + nextest 6-9.5,
    # per shard of 3), and the ~17 GB archive download
    # took 7.5-28.5 min (PR #592 runs 41955468502, 41967960980). At 45 min
    # shard 2 was cancelled mid-run after a 28.5 min download. Allow hash
    # imbalance and slow runners. nextest's 4 x 60s test limit stays.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3]
        shards: [3]
    steps: &shard-steps
      - uses: actions/checkout@v4.3.1
      - *free-linux-disk
      - *windows-host-disk
      - *windows-dev-drive
      - *posix-rust-toolchain
      - *macos-rust-shims
      - *linux-system-deps
      - *linux-mold
      - *install-nextest
      - *install-nextest-windows
      - name: Download nextest archive
        uses: actions/download-artifact@v8.0.2
        with:
          name: nextest-${{ matrix.os }}.tar.zst
          path: ${{ runner.temp }}/nextest-artifact
          skip-decompress: true

      - name: Download archive path assertions
        uses: actions/download-artifact@v8.0.2
        with:
          name: nextest-paths-${{ matrix.os }}
          path: ${{ runner.temp }}/nextest-artifact

      - name: Check archive paths (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # macOS ships Bash 3: read lines individually rather than mapfile.
          { IFS= read -r build_workspace; IFS= read -r build_target; } < "$RUNNER_TEMP/nextest-artifact/paths.txt"
          test "$build_workspace" = "$GITHUB_WORKSPACE"
          test "$build_target" = "$GITHUB_WORKSPACE/target"

      - name: Check archive paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = Get-Content "$env:RUNNER_TEMP/nextest-artifact/paths.txt"
          if ($paths[0] -ne $env:GITHUB_WORKSPACE -or $paths[1] -ne $env:ARCHON_TARGET_DIR) {
            throw 'Archive build paths differ from shard paths; env! literals cannot be remapped'
          }

      # Issues #564/#581: private mount seals need unprivileged user namespaces.
      - name: Allow private mount namespaces for Linux boundary tests
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Main run 41990470644: the extracted test build is ~79G (job
      # 127143481207, 41G -> 120G used during extraction on a 145G disk), and
      # the 16G archive sat beside it. Extract once and delete only the
      # archive, so the test run has ~16G more room. A 72G runner (job
      # 127143481269) cannot hold the 79G build at all; that is tracked
      # separately in #595 (smaller test binaries).
      # Extract once, delete only the archive, then reuse the extracted build.
      # Layout and reuse flags: https://nexte.st/docs/ci-features/archiving/
      - name: Run tests (nextest)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
          # 32 MiB per test thread. libtest runs every test on a thread whose
          # stack defaults to 2 MiB, and tokio's blocking pool — where
          # `WorkflowV2ScriptRunner::run` hosts the script runtime — inherits
          # the same default. In a debug build the v3 live runner's poll
          # frames no longer fit: eight bin tests (`workflow_live_v2_
          # lifecycle_e2e_tests_{b,e}`, `workflow_live_v2_blocking_gap_tests`,
          # the canary regressions, `declared_output_tests`) passed at
          # d79f930bc and aborted with SIGABRT at 6294791c9 with no change to
          # the tests. The one outsized frame — `LiveAgentDispatch::run_call`
          # carrying four copies of the live call future, 1.3-1.5 MiB under
          # lldb — is boxed at the source; what remains is the read-only
          # fan-out path of the decomposed lifecycle, a stack of 30-430 KiB
          # frames that measured between 2 and 3 MiB (fails at 2, passes at
          # 3). The env var is the standard remedy for large debug futures; it
          # reserves address space, not memory, and child test processes
          # inherit it. Same family as the Windows main-thread bump in
          # `.cargo/config.toml`.
          RUST_MIN_STACK: "33554432"
        # Compilation/link memory is bounded in the archive step above. Keep
        # its env here too for tests that spawn Cargo; this job only reuses builds.
        #
        # NOTE on test parallelism (#233):
        # No --test-threads flag here on purpose. nextest defaults to
        # num_cpus, which is fine on GitHub-hosted runners (ubuntu/macos:
        # 4 cores + 16GB RAM, windows: 4 cores + 16GB RAM).
        #
        # The project's WSL2 dev box rule "cargo test MUST use
        # --test-threads=2" applies to LOCAL developer invocations only
        # (small RAM, prior crash incidents on parallel rustc/test
        # binaries). It does NOT apply to CI runners. Forcing
        # --test-threads=1 here previously timed out the ubuntu test step
        # at 64+ minutes (commit 3fded2c). Job timeout-minutes still bounds
        # future regressions while allowing current workspace tests to finish.
        # Emit a heartbeat so GitHub does not kill long, quiet nextest
        # phases as an apparent no-output hang, and include disk snapshots so
        # runner-capacity failures remain diagnosable without verbose rustc
        # command logs.
        run: |
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          (
            cargo nextest list --archive-file "$RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst" \
              --workspace-remap "$GITHUB_WORKSPACE" \
              --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
              --list-type binaries-only > /dev/null
            df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
            rm -- "$RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst"
            df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
            exec cargo nextest run \
              --binaries-metadata "$GITHUB_WORKSPACE/target/nextest/binaries-metadata.json" \
              --cargo-metadata "$GITHUB_WORKSPACE/target/nextest/cargo-metadata.json" \
              --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
              --partition "hash:${{ matrix.shard }}/${{ matrix.shards }}" --no-fail-fast
          ) &
          nextest_pid=$!
          # PR #592 run 41941578008: ubuntu shard 3/3 filled the disk and the
          # runner died before it uploaded any log. Below 6 GiB free, record
          # the running processes, stop the tests first, then show what holds
          # the disk, and fail the step, so the log survives with the cause.
          guard_fired=0
          ticks=0
          while kill -0 "$nextest_pid" 2>/dev/null; do
            sleep 10
            ticks=$((ticks + 1))
            if (( ticks % 6 == 0 )); then
              echo "nextest still running..."
              df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
            fi
            avail_kb=$(df -Pk "$GITHUB_WORKSPACE" 2>/dev/null | awk 'NR==2 {print $4}' || true)
            if [[ -n "$avail_kb" && "$avail_kb" -lt 6291456 ]]; then
              guard_fired=1
              procs=$(ps -Ao pid,ppid,etime,rss,command 2>/dev/null || true)
              pkill -TERM -P "$nextest_pid" 2>/dev/null || true
              kill -TERM "$nextest_pid" 2>/dev/null || true
              echo "::error::disk below 6 GiB free during tests (${avail_kb} KiB); nextest stopped"
              printf "%s\n" "$procs" | head -60 || true
              sleep 5
              pkill -KILL -P "$nextest_pid" 2>/dev/null || true
              kill -KILL "$nextest_pid" 2>/dev/null || true
              df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
              du -xhd 3 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME" /tmp 2>/dev/null | sort -h | tail -40 || true
              break
            fi
          done
          status=0
          wait "$nextest_pid" || status=$?
          if (( guard_fired )); then status=1; fi
          df -h / "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          exit "$status"

      - name: Require 8.3 names on the Windows test volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testRoot = $env:RUNNER_TEMP
          $volume = [System.IO.Path]::GetPathRoot($testRoot).TrimEnd('\')
          Write-Output "System-wide 8.3 state before enable on ${volume}:"
          & fsutil 8dot3name query
          & fsutil 8dot3name set 2
          $enableOutput = & fsutil 8dot3name set $volume 0 2>&1
          $enableExitCode = $LASTEXITCODE
          $enableOutput | ForEach-Object { Write-Output $_ }
          if ($enableExitCode -ne 0) {
            $testRoot = Join-Path $env:SystemDrive 'archon-8dot3-test'
            New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
            $volume = [System.IO.Path]::GetPathRoot($testRoot).TrimEnd('\')
            Write-Output "System-wide 8.3 state before enable on fallback volume ${volume}:"
            & fsutil 8dot3name query
            & fsutil 8dot3name set 2
            $fallbackEnableOutput = & fsutil 8dot3name set $volume 0 2>&1
            $fallbackEnableExitCode = $LASTEXITCODE
            $fallbackEnableOutput | ForEach-Object { Write-Output $_ }
          }
          Write-Output "System-wide 8.3 state after enable on ${volume}:"
          & fsutil 8dot3name query
          $probePath = Join-Path $testRoot 'archon-8dot3-probe-long-directory-name'
          $probeCreated = $false
          $shortPath = ''
          $probeError = $null
          try {
            New-Item -ItemType Directory -Path $probePath | Out-Null
            $probeCreated = $true
            try {
              $shortPath = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($probePath).ShortPath
            } catch {
              $probeError = $_
            }
            Write-Output "8.3 probe long path: $probePath"
            Write-Output "8.3 probe short path: $shortPath"
            if ([string]::IsNullOrWhiteSpace($shortPath) -or $shortPath -eq $probePath) {
              $message = "8.3 short names are not created on $volume; the alias test requires them"
              if ($null -ne $probeError) {
                $message += " (ShortPath lookup failed: $($probeError.Exception.Message))"
              }
              throw $message
            }
          } finally {
            if ($probeCreated) {
              Remove-Item -LiteralPath $probePath -Recurse -Force
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHON_8DOT3_TEST_ROOT=$testRoot"
          exit 0

      - name: Run tests (nextest, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Same reason as the POSIX step above: the archon bin's workflow
          # live-runner tests overflow libtest's 2 MiB test-thread stack.
          RUST_MIN_STACK: "33554432"
        # Deliberately NOT setting CARGO_BUILD_JOBS=1, unlike the POSIX step.
        # That exists to keep peak link memory inside ubuntu-latest's 7GB
        # ceiling (#225 SIGBUS). Windows runners have 16GB and a different
        # linker, so the setting buys nothing there and costs enormously:
        # nextest links ~200 test binaries, and serialising MSVC linking is why
        # run 30697135157 spent ~100 minutes in this step and was cancelled at
        # the 2h wall, against 8 minutes for the same suite on macOS.
        #
        # No heartbeat loop either: that exists on the POSIX side to keep long
        # quiet phases diagnosable alongside disk snapshots, and reproducing
        # bash job control in pwsh would buy nothing. --no-fail-fast so one
        # failing crate still reports the rest.
        # Same archive/extracted-build overlap as the POSIX shard (PR #592,
        # main run 41990470644: 16G archive beside a ~79G extracted build).
        # Windows extracts target/ onto the Dev Drive; metadata lives there too.
        run: |
          cargo nextest list --archive-file "$env:RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst" `
            --workspace-remap "$env:GITHUB_WORKSPACE" `
            --extract-to (Split-Path $env:ARCHON_TARGET_DIR -Parent) --extract-overwrite `
            --list-type binaries-only > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try { Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/nextest-artifact/nextest-${{ matrix.os }}.tar.zst" -ErrorAction Stop
          try { Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining } catch { Write-Warning "volume log: $_" }
          cargo nextest run `
            --binaries-metadata "$env:ARCHON_TARGET_DIR/nextest/binaries-metadata.json" `
            --cargo-metadata "$env:ARCHON_TARGET_DIR/nextest/cargo-metadata.json" `
            --workspace-remap "$env:GITHUB_WORKSPACE" --target-dir-remap "$env:ARCHON_TARGET_DIR" `
            --partition "hash:${{ matrix.shard }}/${{ matrix.shards }}" --no-fail-fast
          exit $LASTEXITCODE

  test-macos:
    name: build + test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [build-macos]
    runs-on: ${{ matrix.os }}
    # Measured execution / 3 is ~13 min; allow hash imbalance, artifact
    # download/extraction and slow runners. nextest's 4 x 60s test limit stays.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        shard: [1, 2, 3]
        shards: [3]
    steps: *shard-steps

  test-windows:
    name: build + test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [build-windows]
    runs-on: ${{ matrix.os }}
    # Measured execution / 4 is ~14 min; allow hash imbalance, artifact
    # download/extraction and slow runners. nextest's 4 x 60s test limit stays.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [1, 2, 3, 4]
        shards: [4]
    steps: *shard-steps

  doctests:
    name: doctests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Independent of builders: a doctest failure must not skip any shard.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 90
          - os: macos-latest
            timeout: 135
          - os: windows-latest
            timeout: 180
    steps:
      - uses: actions/checkout@v4.3.1
      - *free-linux-disk
      - *windows-host-disk
      - *windows-dev-drive
      - *posix-rust-toolchain
      - *windows-rust-toolchain
      - *macos-rust-shims
      - *linux-system-deps
      - *linux-mold
      - *posix-cache-target
      - *windows-cache-target
      - uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: ci-${{ matrix.os }}
          workspaces: ". -> ${{ env.CARGO_CACHE_TARGET }}"
          save-if: false
      - name: Run doctests
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "1"
        # Same workspace doctest command and all three OSes as the old CI.
        run: cargo test --workspace --doc -- --test-threads=1

      - name: Run doctests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: "1"
        run: cargo test --workspace --target-dir "$env:ARCHON_TARGET_DIR" --doc -- --test-threads=1

  python-security-tests:
    name: Python security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install HTTP test dependencies
        run: python3 -m pip install fastapi httpx uvicorn
      - name: Run Issue 115 security tests
        run: |
          python3 -m unittest -v \
            tests/python/test_archon_marker_server.py \
            tests/python/test_security_guidance_extensibility.py
      - name: Run Issue 115 live smoke
        run: python3 tests/python/live_issue_115_smoke.py

  # #325: the workflow script suites are plain node files (no npm project), so
  # nothing ran them and their pass was local only. Suites are discovered by
  # name, so a new `*_test.cjs` / `*.test.cjs` is picked up without editing
  # this job. Every suite runs even after a failure; any failure, or finding
  # no suites at all, fails the job.
  node-tests:
    name: node test suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every node *.cjs test suite
        run: |
          mapfile -t suites < <(git ls-files -- '*_test.cjs' '*.test.cjs')
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::no node test suites found; the discovery glob matches nothing"
            exit 1
          fi
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::node $suite"
            node "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          echo "ran ${#suites[@]} node suites, ${#failed[@]} failed"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::node suite failed: %s\n' "${failed[@]}"
            exit 1
          fi

  arch-lint:
    name: arch-lint (D10 spawn-everything)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run architecture lint scaffold
        run: bash scripts/lint/arch-lint.sh
      - name: check-file-sizes (NFR-FOR-D4-MAINTAINABILITY)
        run: bash scripts/check-file-sizes.sh
      # Wired in for #132. It existed unreferenced for long enough that the
      # thing it guards had already drifted past it, which is the failure mode
      # a gate is supposed to prevent rather than exhibit.
      #
      # ripgrep is not on the ubuntu-latest image, and the script refuses to
      # report clean without it (exit 2) rather than silently scanning nothing —
      # correct behaviour, so install the tool instead of weakening the check.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: check-context-window-literals
        run: bash scripts/check-context-window-literals.sh
      - name: tui-banned-patterns-gate
        run: bash scripts/tui-banned-patterns-gate.sh
      - name: tui-banned-patterns-gate self-test
        run: bash scripts/tui-banned-patterns-gate.selftest.sh
      # Replaces the 24 per-task grep verifiers deleted from scripts/tests/.
      # Each of those checked one hardcoded path for one hardcoded marker;
      # everything else they asserted was already compiler-enforced, and the
      # hardcoded paths made them fail on file splits rather than on defects.
      # This is the one check among them a compiler cannot make: whether a
      # slice that was wired has quietly regressed to a stub.
      - name: check-deferral-markers self-test (prove it can go red)
        run: bash scripts/check-deferral-markers.sh --self-test
      - name: check-deferral-markers
        run: bash scripts/check-deferral-markers.sh
      # See scripts/tests/README.md. These are self-tests of gates this
      # workflow runs; a gate nobody has watched fail is indistinguishable
      # from one that cannot fail.
      - name: check-file-sizes self-test
        run: bash scripts/tests/test_check_file_sizes.sh
      - name: baseline-diff self-test
        run: bash scripts/tests/test_ci_baseline_diff.sh
      - name: archon-init.sh behavioural test
        run: bash scripts/tests/archon-init-test.sh
      - name: preserve-invariants is wired into CI
        run: bash scripts/tests/ci-preserve-invariants-wired.sh

  config-sync:
    name: config-sync (template vs shipped .archon config)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: config.toml and .archon/config.toml must be identical
        run: |
          if ! diff -u config.toml .archon/config.toml; then
            echo "::error::config.toml (root template) and .archon/config.toml (shipped project config) have drifted; they must be byte-identical."
            echo "Update the stale side, normally: cp config.toml .archon/config.toml"
            exit 1
          fi

  r0-entry-gate:
    name: r0-entry-gate (learning prerequisite closure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 is load-bearing, not caution. The gate re-checks that
      # every recorded closure commit is still an ancestor of HEAD, and on the
      # default shallow checkout `git merge-base --is-ancestor` cannot answer,
      # so `--require-commits` below would fail the job rather than pass it
      # quietly. Full history is what makes the commit half of the evidence
      # mean anything.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: R0 entry gate (findings 9, 11, 17, 40-43)
        run: bash scripts/check-r0-entry-gate.sh --require-commits
      # Same reasoning as the preserve-invariants self-test: a gate nobody has
      # watched go red is indistinguishable from a gate that cannot.
      - name: R0 entry gate self-test (prove it can go red)
        run: bash scripts/check-r0-entry-gate.sh --self-test
      # This proves the version guard, not execution under an actual Bash 3.
      - name: R0 entry gate rejects unsupported Bash (test-only override)
        run: |
          rc=0
          R0_GATE_FAKE_BASH_MAJOR=3 bash scripts/check-r0-entry-gate.sh --self-test 2>r0-version-error.txt || rc=$?
          cat r0-version-error.txt
          test "$rc" -eq 2
          grep -F 'bash 4 or later is required' r0-version-error.txt
      - name: R0 entry gate is wired (no uncalled artefacts)
        run: bash scripts/tests/r0-entry-gate-wired.sh

  preserve-invariants:
    name: preserve-invariants (TASK-AGS-OBS-918)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: check-preserve-invariants (fraud detection)
        run: bash scripts/check-preserve-invariants.sh
      - name: preserve-invariants self-test (fraud-detection-of-the-fraud-detector)
        run: bash scripts/tests/preserve-invariants-self-test.sh

  tui-file-size-lint:
    name: tui-file-size-lint (NFR-TUI-QUAL-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-tui-file-sizes
        run: bash scripts/check-tui-file-sizes.sh

  tui-cycle-check:
    name: tui-cycle-check (NFR-TUI-MOD-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-tui-module-cycles
        run: bash scripts/check-tui-module-cycles.sh

  tui-duplication-check:
    name: tui-duplication-check (NFR-TUI-MOD-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: check-tui-duplication
        run: bash scripts/check-tui-duplication.sh

  tui-complexity:
    name: tui-complexity (NFR-TUI-QUAL-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev
      - name: check-tui-complexity
        run: bash scripts/check-tui-complexity.sh

  tui-coverage:
    name: tui-coverage (NFR-TUI-QUAL-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: check-tui-coverage
        run: TUI_COVERAGE_MIN=10 bash scripts/check-tui-coverage.sh

  build-release-smoke:
    name: release build smoke
    runs-on: ubuntu-latest
    needs: [test-ubuntu, test-macos, test-windows, doctests]
    # Only build the release profile when a release is actually intended.
    #
    # This job sits at the tail of every run: it waits for the whole test matrix
    # — roughly 36 min ubuntu, 58 macOS, 87 Windows — and then spends several
    # more minutes compiling a profile nothing else in the run uses. Almost no
    # commit is a release, so almost all of that proves something nobody is
    # about to ship.
    #
    # Skipping is deliberately the mechanism rather than cancelling the run by
    # hand. A cancelled run concludes `cancelled`, and release.yml fires on
    # `workflow_run` gated on `conclusion == 'success'` — so cancelling to save
    # time on an ordinary commit would also silently skip the real release on a
    # version bump. A skipped job leaves the run green and the chain intact.
    #
    # Nothing is lost when it skips: release.yml builds the release profile
    # itself, with the cross targets, whenever Cargo.toml carries a version that
    # has no tag yet. This job exists to answer the same question *earlier*, on
    # demand, for a commit that is about to become one — 71eec6a4b is the
    # precedent, where the release profile needed toolchain targets the debug
    # build never asked for.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-smoke
      - run: cargo build --release --bin archon
      - name: Smoke test binary
        run: ./target/release/archon --version || ./target/release/archon --help || true
