name: Release

on:
  # Auto-trigger after CI succeeds on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger as fallback
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "10"

permissions:
  contents: write

jobs:
  # ── Gate: only proceed if CI passed + version is unreleased ──
  check:
    name: check version
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n '/\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION} (tag: v${VERSION})"

      - name: Check if tag already released
        id: check_tag
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v${{ steps.version.outputs.version }} is new — building release."
          fi

  # ── Build release binaries for all platforms ─────────────────
  build:
    name: build ${{ matrix.target }}
    needs: [check]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          # x86_64-apple-darwin is deliberately absent. ONNX Runtime stopped
          # shipping x64 macOS binaries at 1.24.1, and `ort` dropped the target
          # rather than wait for upstream to stop compiling — so `ort-sys`
          # fails the build outright with "no prebuilt binaries available for
          # target x86_64-apple-darwin".
          #
          # Keeping it would mean vendoring an ONNX Runtime build and linking
          # it ourselves for a platform Rust has demoted to tier 2 and Apple
          # has stopped shipping OS releases for. Apple Silicon covers every
          # Mac still receiving macOS updates.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # macOS-runner workaround (same root cause as ci.yml): the GH macOS
      # image ships `/usr/local/bin/cargo` as a rustup-init shim that
      # intercepts `cargo build` with `unexpected argument 'build' found`.
      # Delete it so PATH deterministically resolves to the dtolnay-installed
      # `$HOME/.cargo/bin/cargo`. Safe on ephemeral GH runners.
      - name: Neutralize macOS rustup-init cargo shim
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo rm -f /usr/local/bin/cargo /usr/local/bin/rustc /usr/local/bin/rustup
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" default stable
          cargo --version

      # The `targets:` input on the toolchain action adds the target to
      # *stable*, but rust-toolchain.toml pins the channel and rustup honours
      # that pin, so `cargo build` runs under the pinned toolchain and never
      # sees the target: `error[E0463]: can't find crate for 'core'`. Native
      # entries hide it because the pinned toolchain already ships its own host
      # target -- which is why exactly the two cross-compiled targets failed
      # and the three native ones passed.
      #
      # Deliberately no `--toolchain` flag: rustup resolves the directory
      # override from rust-toolchain.toml, so the target lands on the pinned
      # channel without this step having to restate the version and drift.
      #
      # Runs after the macOS shim removal above, which deletes the rustup-init
      # stub at /usr/local/bin/rustup that would otherwise intercept this.
      - name: Add target to the pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"

      - name: Install Linux build deps
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y pkg-config perl make libasound2-dev

      - name: Install cross-compilation deps (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config perl make
          # Microphone and speaker support links ALSA, so a cross build needs
          # the arm64 headers, not the host's. dpkg needs the architecture
          # enabled first, and the arm64 packages come from ports.ubuntu.com —
          # the default sources only carry amd64 and would 404 on every arm64
          # fetch, so the existing entries are pinned to amd64 before the ports
          # list is added.
          #
          # Two source formats to pin, not one. Noble runners describe their
          # repos in deb822 (/etc/apt/sources.list.d/*.sources), which the
          # one-line sed cannot see. Pinning only the .list files left those
          # stanzas unrestricted, so apt asked security.ubuntu.com — which
          # carries amd64 and i386 only — for arm64 and the step died on
          # `binary-arm64/Packages 404 Not Found`.
          sudo sed -i 's/^deb \(http\|mirror+file\)/deb [arch=amd64] \1/' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          # Rewrite rather than skip-if-present: the guard has to hold per
          # stanza, and a file whose first stanza is already pinned would
          # otherwise leave its later ones open. Dropping any existing line
          # first also makes this idempotent. Forcing amd64 on every .sources is
          # the intent -- the one arm64 source we want is the ports .list added
          # below.
          for sources in /etc/apt/sources.list.d/*.sources; do
            [ -e "$sources" ] || continue
            sudo sed -i -e '/^Architectures:/d' -e '/^Types:/a Architectures: amd64' "$sources"
          done
          sudo dpkg --add-architecture arm64
          # Every pocket the amd64 side has, not just the release pocket.
          # libasound2t64 is Multi-Arch: same, so dpkg requires the amd64 and
          # arm64 copies to be the *same version*. With only `noble` on ports,
          # arm64 could offer no more than the release build while the runner
          # already carried a newer amd64 one from noble-updates, and apt
          # reported the mismatch as an uninstallable dependency:
          #   libasound2-dev:arm64 : Depends: libasound2t64:arm64 (= 1.2.11-1build2)
          #                          but it is not going to be installed
          suite=$(lsb_release -cs)
          for pocket in "$suite" "$suite-updates" "$suite-security"; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $pocket main universe"
          done | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # What each arch is actually offered. The failure this replaces was a
          # version mismatch, and the log showed only the consequence -- leaving
          # the versions to be inferred rather than read.
          apt-cache policy libasound2t64 libasound2t64:arm64 libasound2-dev:arm64 || true
          sudo apt-get install -y libasound2-dev:arm64
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Fetch dependencies with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --target "${{ matrix.target }}"; then
              exit 0
            fi
            echo "cargo fetch failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          cargo fetch --target "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --bin archon --target ${{ matrix.target }}

      - name: Strip binary (unix)
        if: runner.os != 'Windows' && !matrix.cross
        run: strip target/${{ matrix.target }}/release/archon

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          NAME="archon-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp target/${{ matrix.target }}/release/archon "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"
          cd dist
          tar -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = "${{ needs.check.outputs.tag }}"
          $NAME = "archon-$TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$NAME" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/archon.exe" "dist/$NAME/"
          Copy-Item README.md "dist/$NAME/"
          Copy-Item LICENSE "dist/$NAME/"
          Compress-Archive -Path "dist/$NAME" -DestinationPath "dist/$NAME.zip"
          (Get-FileHash "dist/$NAME.zip" -Algorithm SHA256).Hash | Out-File "dist/$NAME.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: archon-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # ── Create draft release: you review + click Publish ─────────
  draft-release:
    name: draft release ${{ needs.check.outputs.tag }}
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create git tag
        run: |
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Archon ${{ needs.check.outputs.tag }}
          draft: true
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          body: |
            ## Archon CLI ${{ needs.check.outputs.tag }}

            ### Packages
            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `archon-${{ needs.check.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux | aarch64 | `archon-${{ needs.check.outputs.tag }}-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS | aarch64 (Apple Silicon) | `archon-${{ needs.check.outputs.tag }}-aarch64-apple-darwin.tar.gz` |
            | Windows | x86_64 | `archon-${{ needs.check.outputs.tag }}-x86_64-pc-windows-msvc.zip` |

            SHA256 checksums included alongside each archive.

            Intel macOS (`x86_64-apple-darwin`) is no longer built. ONNX
            Runtime stopped publishing x64 macOS binaries at 1.24.1 and the
            Rust `ort` bindings dropped the target with it, so the embedding
            runtime archon depends on cannot be linked there without vendoring
            a custom build. Apple Silicon covers every Mac still receiving
            macOS updates.

            ---
            *This is a draft release. Review the artifacts and click **Publish** when ready.*
