# ============================================================================
# Archon CLI — Example / Template Configuration
# ============================================================================
# This file is the reference config shipped at the repo root. Copy it to one
# of the following paths to activate it:
#
#   ~/.config/archon/config.toml          — USER layer (global, all projects)
#   <workdir>/.archon/config.toml          — PROJECT layer (committed to repo)
#   <workdir>/.archon/config.local.toml    — LOCAL layer (gitignored; secrets)
#
# Load order (lowest → highest priority; later overrides earlier):
#   1. User  →  2. Project  →  3. Local  →  4. Worktree  →  5. --settings overlay
#
# Every field is listed with its default value and valid range.
# Comment out (prefix with #) any field to fall back to the schema default.
# ============================================================================


# ----------------------------------------------------------------------------
# [api] — Anthropic API + model defaults
# ----------------------------------------------------------------------------
[api]
# Model to use. Options: claude-opus-5, claude-sonnet-5, claude-sonnet-4-6, claude-opus-4-8, claude-opus-4-7, claude-haiku-4-5-20251001
default_model = "claude-opus-5"
# Extended-thinking token budget (0 = disabled)
thinking_budget = 16384
# Reasoning effort: "low" | "medium" | "high"
default_effort = "high"
# Max HTTP retry attempts on transient failures
max_retries = 3
# Override API endpoint or base URL (for LiteLLM / Ollama / proxies). Leave commented to use default.
# Resolution order: ANTHROPIC_BASE_URL env var > this field > https://api.anthropic.com/v1/messages
# Base URLs such as https://api.deepseek.com/anthropic are expanded to /v1/messages.
# base_url = "http://localhost:11434/v1/messages"


# ----------------------------------------------------------------------------
# [llm] — Alternative LLM providers (when not using Anthropic directly)
# ----------------------------------------------------------------------------
# Anthropic (via the [api] section above) is the default and works with your
# Claude subscription / API key. The sub-sections below are INACTIVE templates
# for swapping to another provider — uncomment only the one you want to use
# AND change `provider` accordingly.
[llm]
# Active provider: "anthropic" | "openai-codex" | "openai" | "bedrock" | "vertex" | "local" | OpenAI-compatible IDs such as "deepseek"
# Hybrid/LLM retrospectives (`archon self retrospective --analyzer hybrid|llm`)
# use this active provider too; there is no separate retrospective provider key.
provider = "anthropic"

# --- OpenAI (uncomment to activate) ---
# [llm.openai]
# api_key = "sk-..."                         # or set OPENAI_API_KEY env var
# base_url = "https://api.openai.com/v1"     # or Azure OpenAI endpoint
# model = "gpt-4o"

# --- AWS Bedrock (uncomment to activate) ---
# [llm.bedrock]
# region = "us-east-1"
# model_id = "anthropic.claude-sonnet-4-20250514-v1:0"

# --- Google Vertex AI (uncomment to activate) ---
# [llm.vertex]
# project_id = "my-gcp-project"
# region = "us-central1"
# model = "claude-sonnet-4-20250514@20250514"
# credentials_file = "/path/to/service-account.json"

# --- Local / Ollama (uncomment to activate) ---
# [llm.local]
# base_url = "http://localhost:11434/v1"
# model = "llama3:8b"
# timeout_secs = 300
# pull_if_missing = true

# Reasoning controls for the local/OpenAI-compatible backend (#123).
#
# `/effort low|medium|high|max` only reaches an OpenAI-compatible server if
# this is configured — there is no portable reasoning switch, so archon will
# not guess one. Default is `mode = "off"`, which sends no reasoning fields at
# all; Ollama and llama.cpp are unaffected.
#
# Use the interface your deployment documents. For DeepSeek V4 Flash on vLLM
# that is `chat_template_kwargs` carrying BOTH `thinking` and the level —
# `reasoning_effort` alone is inert there, so `kwargs` is not optional:
#
# [llm.local.reasoning]
# mode = "chat_template_kwargs"
# effort_key = "reasoning_effort"
# kwargs = { thinking = true }        # Qwen3/GLM read `enable_thinking` instead
# [llm.local.reasoning.effort_map]
# low = "low"
# medium = "low"     # DeepSeek V4 documents off/low/high/max — there is no
#                    # medium tier, and `low` is its no-prefix baseline
# high = "high"
# max = "max"
#
# A level with no entry in `effort_map` is not sent at all, which is how a
# backend with a shorter ladder opts out of the top rungs.
#
# Some servers also accept a top-level `reasoning_effort` field, which vLLM
# validates — a bad tier 400s and names the accepted ones, whereas an unknown
# `chat_template_kwargs` key returns 200 and is silently ignored. That is
# useful for catching typos, but it is not what the DeepSeek recipe documents,
# so prefer the documented path unless you have checked:
#
# [llm.local.reasoning]
# mode = "top_level"
# effort_key = "reasoning_effort"


# ----------------------------------------------------------------------------
# [models.anthropic] — Anthropic model aliases
# ----------------------------------------------------------------------------
# `opus` tracks the current highest-quality Claude Opus generation. Earlier
# Opus IDs remain valid as literal `/model` overrides when you need a pin.
[models.anthropic]
opus = "claude-opus-5"
sonnet = "claude-sonnet-5"
haiku = "claude-haiku-4-5"


# ----------------------------------------------------------------------------
# [models.openai-codex] — Codex model aliases
# ----------------------------------------------------------------------------
# These aliases are used by Codex sessions, chat defaults, and subagents. When
# [llm].provider = "openai-codex" and [api].default_model is still a Claude
# model id, Archon maps Sonnet/Opus-tier defaults to `default` and Haiku-tier
# defaults to `mini` before calling Codex. Concrete Codex model ids are kept.
[models.openai-codex]
default = "gpt-5.6-sol"
codex = "gpt-5.3-codex"
mini = "gpt-5.6-luna"


# ----------------------------------------------------------------------------
# [providers.openai-codex] — Codex (ChatGPT subscription) provider
# ----------------------------------------------------------------------------
# Codex authentication uses ChatGPT subscription OAuth tokens against
# https://chatgpt.com/backend-api/codex/responses. All spoof fields are
# optional; missing fields fall through to fetched/bundled manifest values.
# Legal guardrail: Archon rejects user agents or custom header values matching
# ChatGPT-* / ChatGPT/ or OpenAI-* / OpenAI/ to avoid impersonating OpenAI's
# own products.
[providers.openai-codex]
enabled = true
# Runtime strategy: "direct" preserves the current direct backend. "auto"
# attempts app-server first and can use direct only when direct_fallback=true.
# "app_server" requires a configured JSON-RPC app-server transport.
runtime = "direct"
direct_fallback = false
# App-server transport for runtime="app_server" or runtime="auto":
# "websocket" uses app_server_url; "stdio" spawns app_server_command with
# app_server_args and talks JSON-RPC over stdin/stdout.
app_server_transport = "websocket"
# app_server_url = "ws://127.0.0.1:11434/codex"
# app_server_command = "codex"
# app_server_args = ["app-server"]
app_server_discovery_timeout_ms = 2500
app_server_model_catalog = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.5", "gpt-5.4"]

[providers.openai-codex.spoof]
# originator  = "openclaw"
# user_agent  = "openclaw/2026.5.1-beta.2"
# client_id   = "app_EMoamEEZ73f0CkXaXp7hrann"
# openai_beta = "responses=experimental"

[providers.openai-codex.spoof.extra_headers]
# "x-codex-version" = "0.34.1"

[providers.openai-codex.manifest]
# fetch_url   = "https://raw.githubusercontent.com/ste-bah/archon-cli/main/crates/archon-llm/resources/codex-compat.json"
# ttl_seconds = 21600
# cache_dir   = "~/.archon/cache/codex-compat"


# ----------------------------------------------------------------------------
# [identity] — Request header / anti-distillation controls
# ----------------------------------------------------------------------------
[identity]
# mode: "clean" (no spoofing) | "spoof" (mimic Claude Code headers) | "custom"
mode = "spoof"
spoof_version = "2.1.89"
spoof_entrypoint = "cli"
# Extra anthropic-beta headers to send (array of strings, or omit)
# spoof_betas = ["fine-grained-tool-streaming-2025-05-14"]
anti_distillation = false
# workload = "coding"   # optional free-form tag

# [identity.custom]   # Only used when identity.mode = "custom"
# user_agent = "archon-cli/1.0.1"
# x_app = "archon"
# [identity.custom.extra_headers]
# "X-Custom-Header" = "value"


# ----------------------------------------------------------------------------
# [personality] — Agent identity injected into the system prompt
# ----------------------------------------------------------------------------
[personality]
name = "Archon"
# MBTI: INTJ INTP ENTJ ENTP INFJ INFP ENFJ ENFP ISTJ ISFJ ESTJ ESFJ ISTP ISFP ESTP ESFP
type = "INTJ"
# Enneagram pattern: [1-9]w[1-9]
enneagram = "4w5"
traits = ["strategic", "direct", "self-critical", "truth-over-comfort"]
communication_style = "terse"


# ----------------------------------------------------------------------------
# [consciousness] — Inner voice + behavioral rule seeding
# ----------------------------------------------------------------------------
[consciousness]
inner_voice = true
# Energy decay multiplier applied each turn (0.0..=1.0). 0.98 = 2% decay/turn.
energy_decay_rate = 0.98
# Energy regenerated after successful tool use (0.0..=1.0).
energy_regen_rate = 0.005
# Minimum active-session energy floor (0.0..=1.0).
energy_floor = 0.1
# Core rules seeded into the memory graph on startup. Idempotent, max 50 rules.
initial_rules = [
    "Always ask before modifying files",
    "Explain reasoning before acting",
    "Never create files unless explicitly requested",
]
# Persist InnerVoice + rule scores across sessions
persist_personality = true
# Max personality snapshots to retain (oldest pruned first)
personality_history_limit = 50


# ----------------------------------------------------------------------------
# [tools] — Tool execution limits
# ----------------------------------------------------------------------------
[tools]
# Seconds before a Bash command is killed. This is the ceiling: the agent may
# request less, but never more.
bash_timeout = 3600
# Seconds below which the agent's own `timeout` argument is ignored.
#
# That argument is chosen by the model, which cannot know how long a cold build
# of a large workspace takes, so a guessed two minutes used to kill work this
# ceiling had budgeted an hour for. Clamped to bash_timeout when larger, so a
# deliberately short bash_timeout still wins.
bash_timeout_floor = 1800
# Max bytes of Bash stdout/stderr captured
bash_max_output = 102400
# Max concurrent tool calls (1..=16)
max_concurrency = 4

# ----------------------------------------------------------------------------
# [tools.cargo] — resource limits for cargo commands the agent runs
# ----------------------------------------------------------------------------
[tools.cargo]
# CARGO_BUILD_JOBS for agent-run cargo commands. 0 = auto (half the logical
# cores, minimum 1). Half rather than all because memory is the binding
# constraint: this workspace links aws-lc-sys, wasmtime and ort, and concurrent
# rustc processes on those peak at gigabytes each.
#
# Raise it if the machine has memory to spare — agents are already serialised on
# the target directory, so one build usually has the box to itself. As a rough
# guide, allow ~2 GB of RAM per job: 8 on a 32 GB host, 5 on a 16 GB host.
build_jobs = 0
# CARGO_INCREMENTAL. Off by default — agent builds are mostly cold, where
# incremental costs disk and time without paying it back.
incremental = false
# ARCHON_WORKFLOW_RESOURCE_CLASS: advisory label a command can read to tell how
# much of the machine it is entitled to. "constrained" | "full"
resource_class = "constrained"


# ----------------------------------------------------------------------------
# [permissions] — Tool-call permission model + fine-grained rules
# ----------------------------------------------------------------------------
[permissions]
# Canonical modes: "default" | "acceptEdits" | "plan" | "auto" | "dontAsk" | "bypassPermissions"
# Legacy aliases accepted: "ask" (= default), "yolo" (= bypassPermissions)
mode = "default"
# Filesystem allow/deny lists (absolute paths or globs)
allow_paths = []
deny_paths = []
# Command classification (by prefix) for Bash tool
safe_commands = []
risky_commands = []
dangerous_commands = []

# Fine-grained rules. Each rule: { tool = "<ToolName>", pattern = "<prefix>:*" }
# Evaluation order: always_deny > always_allow > always_ask > mode logic.
always_allow = []
always_deny = []
always_ask = []

# Example:
# [[permissions.always_allow]]
# tool = "Bash"
# pattern = "git status"
# [[permissions.always_deny]]
# tool = "Bash"
# pattern = "rm -rf"


# ----------------------------------------------------------------------------
# [sandbox] — Execution isolation backend selection
# ----------------------------------------------------------------------------
[sandbox]
# Available backends: "disabled" | "logical" | "docker" | "ssh" | "openshell"
# Current /sandbox toggle uses the logical policy gate. Docker/SSH/OpenShell are
# separate isolation backends and require their matching enabled=true section.
backend = "disabled"
# Backend routing mode:
#   "risky" / "shell" route Bash/Shell through the backend but leave normal
#   host-side tools such as Write/Edit/WebFetch under permission preflight.
#   "all" requires every tool to be backend-compatible, so unsupported
#   host-side mutation/network/agent-spawn tools are blocked.
mode = "risky"
# Backend lifecycle: "session" | "turn" | "tool"
scope = "session"
# Workspace mount policy: "ro" | "rw" | "scratch"
workspace_access = "ro"

[sandbox.docker]
# Real Bash execution backend when sandbox.backend = "docker" and enabled=true.
enabled = false
binary = "docker"
image = "ubuntu:24.04"
# "disabled" | "limited" | "enabled"
network = "disabled"
memory_limit = "2g"
cpu_limit = "2"
writable_paths = []
env_allowlist = []
privileged = false
mount_docker_socket = false
mount_home = false

[sandbox.ssh]
# Real Bash execution backend when sandbox.backend = "ssh" and enabled=true.
enabled = false
binary = "ssh"
# host = "sandbox.example"
# user = "archon"
port = 22
# key_file = "~/.ssh/id_ed25519"
# "remote" runs from remote_workdir; "mirror" assumes the same path exists remotely.
workspace_mode = "remote"
# remote_workdir = "/srv/archon/workspace"
host_key_checking = true
host_shell_fallback = false

[sandbox.openshell]
# Real Bash execution backend when sandbox.backend = "openshell" and enabled=true.
enabled = false
binary = "openshell"
# "upload" stages the current workdir into /sandbox/<basename> before Bash.
# "remote" runs from remote_workdir or /sandbox; "mirror" requires the same
# absolute path to exist inside the OpenShell runtime.
workspace_mode = "upload"
gateway = "openshell"
# remote_workdir = "/sandbox"
# policy = "locked-down"
providers = []
gpu = false
# Provider injection stays disabled so Anthropic Claude Code spoofing and other
# provider routing remain host-side in Archon's LLM runtime.
provider_injection = false
# Never fall back to direct host shell when OpenShell activation fails.
host_shell_fallback = false


# ----------------------------------------------------------------------------
# [context] — Conversation compaction + caching
# ----------------------------------------------------------------------------
[context]
# Fraction of context window that triggers auto-compaction (0.0..=1.0)
compact_threshold = 0.80
# Hard cap on context tokens (None = use model default)
# max_tokens = 200000
# Recent turns always preserved through compaction
preserve_recent_turns = 3
# Proactive pressure gates keep giant transcripts/tool outputs from being
# replayed verbatim just because a model advertises a very large context window.
rate_limit_pressure_tokens = 120000
rate_limit_pressure_body_bytes = 320000
large_request_retry_body_bytes = 320000
# Use cache_control breakpoints on static system prompt blocks
prompt_cache = true
# Which cache wire format the endpoint accepts, when it cannot be inferred.
#
# "auto" asks the provider, which recognises the official Anthropic Messages
# endpoint and nothing else. A gateway URL (LiteLLM, an OpenAI-compatible proxy,
# anything self-hosted) tells Archon nothing about what is behind it, so caching
# stays OFF and every request is billed in full -- the whole system prompt, the
# whole tool schema block and the whole conversation, every turn.
#
# Set this explicitly when you know the endpoint forwards cache directives.
# LiteLLM, for one, translates `cache_control` into Bedrock `cachePoint`.
#
# This names the WIRE FORMAT Archon should emit, not the service that ends up
# answering. Behind a gateway they are different things: pointing Archon at
# LiteLLM in front of Bedrock still wants "anthropic" here, because Archon
# speaks the Anthropic Messages format and LiteLLM is what converts
# `cache_control` into Bedrock's `cachePoint`. "bedrock" is for Archon's own
# Converse client talking to AWS directly.
#
#   auto       ask the provider (default; safe, and off for every gateway)
#   anthropic  cache_control blocks -- Anthropic API, and ANY gateway speaking
#              its Messages format, whatever is behind it
#   bedrock    cachePoint elements -- Archon's native Bedrock Converse client
#   responses  prompt_cache_breakpoint -- GPT-5.6 and later
#   automatic  provider caches a stable prefix by itself; emit nothing (OpenAI)
#   off        strip every directive
#
# What this setting does NOT choose is the token minimums, because those are not
# yours to pick -- they belong to whichever service answers the request, and the
# services disagree. Sonnet 4.5 caches from 1,024 tokens on Anthropic's own
# endpoint and 4,096 on Bedrock; Opus 4.6 takes a one-hour TTL on the first and
# five minutes only on the second.
#
# Archon takes those from the provider, not from this line. Talking to Bedrock
# directly it uses AWS's figures, to Anthropic or a subscription it uses
# Anthropic's, to Vertex it uses Anthropic's again. Behind a GATEWAY it cannot
# tell, so it assumes the STRICTEST of them: the highest minimum, and an
# extended TTL only where every candidate service allows one. That is the safe
# direction -- a checkpoint set too high just starts caching later, where one set
# too low is discarded in silence and billed in full. If you know what your proxy
# forwards to and want the exact figures, state them per model below.
prompt_cache_strategy = "auto"

# Per-model cache parameters, keyed by a substring of the model id.
#
# No provider exposes these through an API. Bedrock's ListFoundationModels and
# GetFoundationModel return modalities, streaming support and lifecycle status --
# nothing about cache minimums, checkpoint limits or TTL -- so Archon ships a
# built-in table taken from the published documentation. Entries here override
# and extend it, which is what lets a model released after your binary work
# correctly without waiting for a release.
#
# min_tokens is the one that costs money when wrong. A checkpoint below a
# model's real minimum is SILENTLY DISCARDED: the request succeeds, is billed in
# full, and looks exactly like a cache hit. A checkpoint above the minimum only
# means caching starts a little later. Archon therefore assumes the LARGER
# minimum for any model it does not recognise -- override that here once you
# know the real figure.
#
# Substring matching, because the same model arrives bare
# (anthropic.claude-sonnet-4-5-...), region-prefixed (eu., us.) and as
# inference-profile ARNs. The most specific matching key wins.
#
# [context.prompt_cache_models."claude-opus-5"]
# min_tokens = 4096      # AWS does not document this model's minimum
# max_checkpoints = 4
# ttl_1h = true
#
# min_tokens and ttl_1h describe the first-party Anthropic API. Where AWS
# documents something different for the same model, add the Bedrock figure too
# and Archon applies it only to Bedrock traffic -- there is no single number that
# is right for both, and a gateway of unknown backing takes the stricter one.
#
# [context.prompt_cache_models."claude-sonnet-4-5"]
# min_tokens = 1024          # Anthropic's own endpoint
# max_checkpoints = 4
# ttl_1h = true
# bedrock_min_tokens = 4096  # what AWS requires for the same model
# bedrock_ttl_1h = false     # five minutes only on Bedrock

# Move this turn's volatile system blocks behind the message history.
#
# Archon appends recalled memories, the inner voice and the turn's reminders to
# the end of the system prompt, which puts content that changes almost every
# turn IN FRONT OF the tools and the entire conversation. Every provider caches
# by common prefix and a prefix is a hit only up to its first changed byte, so
# one different memory invalidates the whole history behind it -- and a cache
# write bills at 1.25x plain input, so re-writing it every turn costs more than
# not caching at all.
#
# With this on, those blocks are appended to the last user message instead --
# where Archon's <system-reminder> content already goes -- leaving the stable
# system prompt, the tools and the full history as one uninterrupted prefix.
#
# On providers that place breakpoints this is an optimisation. On the ones that
# cache implicitly (GPT-5.5 and earlier, DeepSeek) it is the ONLY lever there
# is: there is no marker to place.
#
# Turn it off if you need those blocks to stay in the system prompt -- it does
# change where the model sees them, later and closer to the user's message.
prompt_cache_reorder = true

# Per-model token prices, keyed by a substring of the model id.
#
# Overrides and extends the built-in table. Same reasoning as
# prompt_cache_models: a model released after the binary, or a vendor revising
# a figure, should not need a new release to be costed correctly.
#
# input_per_mtok and output_per_mtok are required and are USD per million
# tokens. The three cache multipliers default to the ratios Anthropic publishes
# and every Claude model uses -- 0.1x to read, 1.25x to write, 2x at the
# one-hour tier -- so most entries need only two numbers.
#
# Regional Bedrock and Vertex endpoints (eu., us., apac. prefixes) carry a 10%
# premium over global ones. Archon applies that on top, from the model id, so
# state the GLOBAL price here.
#
# [context.model_pricing."gpt-5.6"]
# input_per_mtok = 1.25
# output_per_mtok = 10.0
#
# [context.model_pricing."some-model-with-a-cheap-cache"]
# input_per_mtok = 0.4
# output_per_mtok = 0.8
# cache_read_multiplier = 0.01
# cache_write_multiplier = 1.0
# cache_write_1h_multiplier = 1.0
# Max characters of hierarchical ARCHON.md (alias: claudemd_max_tokens)
archonmd_max_tokens = 8192
# Optional model override for requests made while the agent is in Plan Mode.
# Comment out to use the active session model.
# plan_model = "claude-sonnet-4-6"
# Approval policy when no interactive AskUser channel is available.
# "reject" fails closed; every other value approves. Default: "approve".
noninteractive_plan_approval = "approve"


# ----------------------------------------------------------------------------
# [memory] — Persistent memory graph (CozoDB + embeddings)
# ----------------------------------------------------------------------------
[memory]
enabled = true
# CozoDB file path. None → default: platform data dir/archon/memory.db
# db_path = "/custom/path/memory.db"

# Embedding provider: "auto" | "local" | "openai"
#   auto   — OpenAI if OPENAI_API_KEY or ARCHON_MEMORY_OPENAIKEY set, else local
#   local  — fastembed BGE-base-en-v1.5 quantized (768-dim, CPU-only, ~100MB download)
#   openai — OpenAI-compatible endpoint (default: text-embedding-3-small, 1536-dim; requires API key)
embedding_provider = "local"

# For "openai", the endpoint and model are overridable so any OpenAI-compatible
# server can serve memory embeddings (e.g. a local LiteLLM proxy). Environment
# variables win over these keys (ARCHON_MEMORY_EMBEDDING_BASE_URL / OPENAI_BASE_URL,
# ARCHON_MEMORY_EMBEDDING_MODEL). Switching endpoint or model changes the
# embedding space — run `archon memory reindex --all` afterwards.
# embedding_base_url = "http://127.0.0.1:1234/v1"
# embedding_model = "embed-v4"

# Hybrid search blend: 0.0 = pure vector, 1.0 = pure keyword. 0.3 = 70% vec / 30% kw.
hybrid_alpha = 0.3

# Intra-op threads for the local embedder's ONNX session. Commented out = a
# capped default (core count, at most 8). This is process-wide, not per-consumer:
# memory and the LEANN code index share one BGE-base session, so the number here
# is the total the embedder will claim. Raising it trades idle threads for
# per-batch latency; BGE-base stops getting faster well before a large core
# count, which is why the default caps rather than following the machine.
# embedding_intra_threads = 4

# --- Memory Garden (background consolidation) ---
[memory.garden]
auto_consolidate = true
min_hours_between_runs = 24
# Word-set (Jaccard) overlap above which two memories are treated as duplicates.
# NOT cosine similarity -- this pass never touches an embedding. It cannot match
# "deploy" to "deploys", so restatements of one instruction score around 0.31
# here and survive it; the semantic pass below is what catches those.
dedup_similarity_threshold = 0.92
# Cosine DISTANCE bands for the embedding pass (0.0 = identical). Banded rather
# than thresholded because the ranges overlap: measured on a real store,
# restatements of one instruction span 0.09-0.35 while genuinely distinct claims
# start at 0.32, so no single cut separates them.
#   <= semantic_dedup_max_distance   -> merged, loser marked superseded
#   <= semantic_review_max_distance  -> counted and left alone, for an
#                                       adjudicator to settle; nothing is written
semantic_dedup_max_distance = 0.15
semantic_review_max_distance = 0.35
# Have the review band judged automatically instead of only when you run
# `/garden`. The judgement runs in the BACKGROUND after startup, not on the
# session-start path: nothing waits on it, so switching this on does not delay
# the first prompt. Merges are applied whenever the verdict comes back, and only
# for pairs the model explicitly calls the same claim; anything else, including a
# failed or slow call, leaves both memories exactly as they were.
# Still OFF by default because it spends an LLM round-trip you did not ask for,
# and merging reshapes stored memories. Left off, the band simply accumulates --
# nothing is written and nothing is lost -- and `/garden` clears it.
auto_adjudicate_review_band = false
# Pending pairs required before that fires, so enabling it does not mean a call
# on every launch. Below the adjudicator's 20-pair-per-run cap, so a run that
# fires at the threshold clears the whole band in one call.
auto_adjudicate_min_pairs = 10
# Days after which low-importance memories are pruned
staleness_days = 30
staleness_importance_floor = 0.3
# Importance lost per day without access
importance_decay_per_day = 0.01
# Hard cap on total memories before overflow pruning
max_memories = 5000
# Number of memories in session-start briefing
briefing_limit = 15
# Run consolidation on a timer, instead of only at session start and on
# `/garden`. OFF by default, and this is the knob that most needs to stay off:
# every other automatic pass is attached to something you did and reports where
# you are looking, while a timer decays and merges your memories at an hour you
# did not choose.
# A scheduled pass is deliberately weaker than the manual one:
#   * it holds a single-run lock, so it cannot overlap another pass in this
#     process or in another Archon sharing the same store;
#   * it stops at the work and time ceilings below, at a point that leaves the
#     store consistent;
#   * it CANNOT DELETE A MEMORY. Anything the prune rules would have removed is
#     recorded as a retirement proposal for review instead, and the memory is
#     left exactly as it was.
scheduled_consolidation = false
# Hours between scheduled passes. The interval is held in the memory store, not
# in this process, so several Archons sharing one store agree on it and a
# restart does not reset the clock.
scheduled_interval_hours = 24
# Ceiling on reversible mutations (importance decay plus merges) in one
# scheduled pass. Reached, the pass stops and says so rather than running on.
scheduled_max_reversible_ops = 500
# Ceiling on how many retirement proposals one scheduled pass may raise, so an
# over-cap store cannot hand you ten thousand decisions. Refusing to propose
# costs nothing: the memories are untouched and the next pass finds them again.
scheduled_max_retirement_candidates = 100
# Wall-clock ceiling on one scheduled pass, in seconds. Nothing is cancelled
# when it expires; the pass simply stops taking on new work.
scheduled_max_seconds = 300
# Generative consolidation. A scheduled pass looks for several memories that
# restate one another and proposes recording the claim once, with its
# corroboration. It never invents wording: the proposed text is verbatim one of
# the sources, so the proposal can be checked against them.
# Clusters must be provenance-compatible -- same memory type, same project
# scope, same writer -- and EVERY PAIR must satisfy that, not merely adjacent
# ones, so a chain of overlapping windows cannot span more than the limit below.
# How many corroborating observations make a claim worth recording once.
consolidation_min_cluster_size = 3
# How far apart in time those observations may be recorded. Bounds what a
# cluster can span, so two records of a fact that CHANGED are not consolidated
# into a claim that the older one is still true.
consolidation_max_span_days = 14
# Word overlap every pair in a cluster must reach to count as the same claim.
# Provenance compatibility says two memories MAY be one claim; this says they
# are. Without it, unrelated facts recorded by one writer on one day would be
# proposed as a single memory citing all of them.
consolidation_min_word_overlap = 0.5

# --- AutoCapture (regex-based memory detection at turn boundary) ---
[memory.auto_capture]
enabled = true

# --- AutoExtraction (LLM-driven fact extraction every N turns) ---
[memory.auto_extraction]
enabled = true
every_n_turns = 5


# ----------------------------------------------------------------------------
# [learning] — Self-learning subsystems
# ----------------------------------------------------------------------------
# Eight subsystems coordinated via LearningIntegration in archon-pipeline.
# Each toggle defaults to enabled = true; flip to false to disable that
# subsystem without touching others. The GNN subsystem has its own training
# and auto-trainer subsections below.

# SONA — Self-Organizing Network Architecture (trajectory pattern store)
[learning.sona]
enabled = true
# TUI slash pipelines record when enabled. Shell/batch pipelines and
# agent-callable GameTheory tools require this explicit opt-in.
pipeline_recording = true

# ProvenanceStore — L-Score system tracking memory reliability
[learning.provenance]
enabled = true

# DESC — Detailed Episodic Storage and Compression
[learning.desc]
enabled = true

# CausalMemory — directed hypergraph of cause-effect relationships
[learning.causal_memory]
enabled = true

# ShadowVectorSearch — contradiction detection across memories
[learning.shadow_vector]
enabled = true

# ReasoningBank — 12 reasoning modes (deductive, inductive, abductive,
# analogical, adversarial, counterfactual, temporal, constraint, decomposition,
# first-principles, causal, contextual) plus PatternMatch + Hybrid meta-modes
[learning.reasoning_bank]
enabled = true

# Reflexion — N-attempt retry loop with self-critique on failed agent dispatch
[learning.reflexion]
enabled = true
max_per_agent = 3

# --- Governed agent profile evolution ---
[learning.agent_evolution]
# Profile versions and proposals are always stored in CozoDB. Runtime use of the
# active profile overlay stays opt-in until an operator enables it explicitly.
active_profile_overlay_enabled = false

# --- Cognitive Executive Loop (policy-governed metacognitive controller) ---
[learning.cognitive]
enabled = true
max_candidates = 5
trivial_turn_tool_policy = "none"
record_decisions = true
record_reflections = true
use_world_model = true
use_jepa = true
use_reasoning_quality = true
use_self_model = true
max_pipeline_ms = 500
situation_ttl_days = 90
reflection_ttl_days = 180
prediction_ttl_days = 90
ledger_dir = ".archon/cognitive"

[learning.cognitive.daemon]
enabled = false
interval_ms = 60000
stale_heartbeat_ms = 120000
run_on_start = true
max_ticks_per_run = 0
# Exit after this long with no archon activity. 0 disables.
#
# The daemon detaches from its launcher on purpose, so it outlives the session
# that started it. Without this it outlived EVERYTHING: one was found alive
# after 10h43m, reparented to init, still holding a deleted copy of a binary
# that had been replaced three times, with four accumulated in a single day.
# Two hours is long enough to survive a quiet session, short enough that an
# abandoned daemon does not outlast the working day.
idle_exit_ms = 7200000

# --- GNN Enhancer (round-trip 1536 → 1024 → 1280 → 1536 graph attention) ---
[learning.gnn]
enabled = true
input_dim = 1536
output_dim = 1536
num_layers = 3
attention_heads = 12
max_nodes = 50
use_residual = true
use_layer_norm = true
# Activation: "relu" | "leaky_relu" | "tanh" | "sigmoid"
activation = "relu"
# Seed for reproducible weight init. 0 = auto (timestamp-derived per run)
weight_seed = 0

# --- GNN training hyperparameters (used by manual /learning-status retrain) ---
[learning.gnn.training]
learning_rate = 0.001
batch_size = 32
max_epochs = 10
early_stopping_patience = 3
validation_split = 0.2
ewc_lambda = 0.1
margin = 0.5
triplet_loss_coefficient = 0.1
max_gradient_norm = 1.0
max_triplets_per_run = 256
max_runtime_ms = 300000        # 5 minutes max per training run

# --- GNN background auto-retraining ---
# ON by default. The GNN retrains itself in the background whenever ANY of
# the trigger thresholds are met (memories / time / corrections).
# Set to false to disable autonomous retraining (only /learning-status retrain works).
[learning.gnn.auto_trainer]
enabled = true
min_throttle_ms = 86400000     # 24 hours minimum between training runs
trigger_new_memories = 20      # fire when N new memories accrued
trigger_elapsed_ms = 86400000  # 24 hours
trigger_corrections = 3        # fire when N user corrections logged
first_run_threshold = 30       # kickoff at startup if memory_count >= this
max_runtime_ms = 300000        # 5 minutes max per run
tick_interval_ms = 60000       # background poll interval (1 minute)

# --- Local World Model (latent next-state trace learning) ---
[learning.world_model]
enabled = true
model_kind = "latent_transition"
# When the background trainer writes a candidate, run the relevant eval gates
# and promote only if policy.world_model.allow_behavior_changes=true and all
# mandatory gates pass. JEPA auto-promotion uses full promotion-grade eval.
auto_promote_advisory = true
require_approval_for_behavior_change = true
state_dim = 384
max_checkpoint_mb = 64
max_prediction_latency_ms = 100
max_counterfactual_actions = 5
store_raw_text = false
include_conversation_turns = true
include_agent_outputs = true

[learning.world_model.embeddings]
source = "local"                   # "local" | "third_party" | "auto"
provider = "fastembed"
model = "bge-base-en-v1.5"
dimensions = 768
projection_dim = 384
cache_enabled = true
cache_max_mb = 1024
redact_before_embedding = true
allow_third_party = false
external_base_url = ""
external_api_key_env = ""

[learning.world_model.labeler]
analyzer = "hybrid"                # "heuristic" | "llm" | "hybrid"
llm_enabled = true
max_events_per_prompt = 30
max_prompt_chars = 128000

[learning.world_model.training]
backend = "auto"                   # "auto" | "cpu" | "metal" | "cuda"
allow_cpu_fallback = true
prefer_accelerator = true
precision = "fp32"
max_accelerator_memory_mb = 4096
batch_size = 32
max_epochs = 10
validation_split = 0.2
promotion_min_delta = 0.02
max_runtime_ms = 300000

[learning.world_model.jepa]
enabled = false
latent_dim = 384
context_window_rows = 8
target_window_rows = 3
prediction_horizons = [1, 3, 5]
mask_ratio = 0.30
ema_decay = 0.996
latent_var_floor = 0.05
min_latent_std = 0.05
min_effective_rank_ratio = 0.50
batch_size = 32
max_epochs = 10
learning_rate = 0.001
alpha_mse = 0.25
beta_aux = 0.50
gamma_horizon = 0.10
delta_var = 0.10
allow_generic_fallback = true
max_runtime_ms = 300000
max_prediction_latency_ms = 50
max_checkpoint_mb = 64
horizon_consistency_tol = 0.02
min_baseline_improvement = 0.05
min_heldout_examples = 200
min_training_examples = 2000
require_native_accelerator_ops = true
allow_accelerated_candidate_cpu_stage = false
min_cuda_validation_examples = 512
min_metal_validation_examples = 512
backend_parity_cosine_floor = 0.99
max_backend_prediction_latency_ms = 50
max_backend_first_call_latency_ms = 5000

[learning.world_model.jepa.eval]
mode = "quick"                    # quick | full | promotion
batch_size = 256
embedding_batch_size = 64
progress_interval_rows = 500
quick_max_runtime_ms = 30000      # quick must be bounded (ms, not minutes)
full_max_runtime_ms = 0           # 0 = unlimited (handles 30+ min workloads)
promotion_max_runtime_ms = 0      # 0 = unlimited
stale_heartbeat_ms = 120000       # stale lock detection when budget = 0
cache_enabled = true
cache_max_mb = 2048               # ~680k BGE-base 768-dim f32 vectors
background_default = false
eval_schema_version = 1           # bump to invalidate ALL cache entries and keys

[learning.world_model.eval]
bootstrap_iterations = 1000
confidence_level = 0.95
parity_precision = "fp32"
parity_min_cosine = 0.95
next_state_baseline_min_delta = 0.10
counterfactual_baseline_min_delta = 0.10
surprise_ks_min_p = 0.05
counterfactual_ndcg_min = 0.60

[learning.world_model.cold_start]
min_rows = 1000
min_sessions = 50
min_observed_days = 7

[learning.world_model.auto_trainer]
enabled = true
min_throttle_ms = 86400000
idle_required_ms = 300000
battery_suspend_below_percent = 30
trigger_new_rows = 100
trigger_surprises = 5
trigger_corrections = 3
trigger_elapsed_ms = 86400000
first_run_threshold = 300
max_runtime_ms = 300000
tick_interval_ms = 60000

# Surprise-weighted replay (W6). The plan is computed and reported on every
# trainer tick; `prioritized_enabled` is the only key that changes what the
# model actually trains on, and it stays false until matched baseline/canary
# evidence exists — prioritised replay moves the training distribution, and a
# model fed its own surprise can drift toward whatever it was already wrong
# about. The remaining keys may only tighten: values above the crate's hard
# bounds are clamped down, never honoured.
[learning.world_model.replay]
prioritized_enabled = false
held_out_fraction = 0.2
batch_size = 512
prioritized_fraction = 0.5
max_surprise_weight = 4.0
max_decile_share = 0.40
seed = 6274407765686619927
split_version = 1

[learning.world_model.guardrails]
enabled = true
interactive_mode = "advisory"
pipeline_mode = "guarded"
tool_run_mode = "learn_only"
verification_run_mode = "learn_only"
high_risk_threshold = 0.70
medium_risk_threshold = 0.45
critical_risk_threshold = 0.85
require_tests_for_coding_high_risk = true
require_build_for_coding_high_risk = true
require_lint_for_coding_high_risk = false
require_typecheck_for_coding_high_risk = false
require_plan_review_for_plan_drift = true
require_source_check_for_research_high_risk = true
require_manual_approval_for_critical = false
max_guardrail_overhead_ms = 40     # guardrail logic only; prediction keeps its own max_prediction_latency_ms cap
record_outcomes_without_prediction = true
max_guardrail_events_per_session = 500

[learning.world_model.retention]
jsonl_rotate_mb = 500
raw_retention_days = 90
retain_cozo_summaries = true
retain_checkpoint_count = 5

# --- Reasoning Quality (visible claim/evidence learning signal) ---
[learning.reasoning_quality]
enabled = true
emit_inline_events = true
post_turn_analysis = true
post_session_analysis = true
shadow_mode_days = 30
apply_trust_updates_after_shadow = true
max_claims_per_turn = 12
max_excerpt_chars = 600
store_raw_text = false
link_user_corrections = true
update_self_trust = true
feed_world_model = true
feed_retrospective = true

[learning.reasoning_quality.critic]
mode = "hybrid"                  # "heuristic" | "llm" | "hybrid"
allow_llm = false
