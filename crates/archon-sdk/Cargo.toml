[package]
name = "archon-sdk"
version.workspace = true
edition.workspace = true

[features]
default = []
# MCP transport for in-process tool registration
sdk-mcp = []
# Memory system integration
sdk-memory = []
# Minimal build: agent + tools only, no MCP/memory
sdk-minimal = []

[dependencies]
archon-core = { path = "../archon-core" }
archon-cognitive = { path = "../archon-cognitive" }
archon-docs = { path = "../archon-docs" }
# The web ingest tab lists knowledge bases from the store, not just from
# `.archon/kb` directories, so it needs the same enumeration the CLI uses.
archon-knowledge = { path = "../archon-knowledge" }
archon-llm = { path = "../archon-llm" }
archon-learning = { path = "../archon-learning" }
archon-cozo = { path = "../archon-cozo" }
# The attached (in-process) web server reads the host's already-open memory
# store instead of opening a second connection to the same database file.
archon-memory = { path = "../archon-memory" }
# `archon/config` validates a permission mode before writing it into the
# handle the agent's gate reads, so it needs the same parser the gate uses.
archon-permissions = { path = "../archon-permissions" }
archon-tools = { path = "../archon-tools" }
archon-workflow = { path = "../archon-workflow" }
# The browser terminal pane's PTY plumbing, moved down so `archon-tools` can
# share it — it cannot depend on this crate, so the code had to go below both
# rather than sideways (#189 Phase 6).
archon-pty = { path = "../archon-pty" }

serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
# `archon/cancel` stops an in-flight prompt through the agent's own
# CancellationToken, so the IDE runtime needs the same token type.
tokio-util.workspace = true
futures-util.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
dirs.workspace = true
tracing.workspace = true
axum.workspace = true
cozo.workspace = true
tower-http.workspace = true
open.workspace = true
rust-embed = "8"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
# Building a BackgroundAgentHandle in tests needs a CancellationToken.
tokio-util = { workspace = true }
# The board endpoints read a real memory database, so their tests need a
# throwaway one on disk: the store is opened by path, not injected.
tempfile = { workspace = true }
