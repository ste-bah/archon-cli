[package]
name = "archon-lanham"
version = "0.1.0"
edition.workspace = true

# Lanham prose-style analyzer + output-style renderer (ported from the god-agent TS).
# Powers `archon style train`. POS-free (L2); golden-tested against the TS reference
# (see tests/golden_*.json + tests/ref_sample.md).

[dependencies]
regex.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "archon-style-train"
path = "src/bin/train.rs"
