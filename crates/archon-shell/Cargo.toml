[package]
name = "archon-shell"
version.workspace = true
edition.workspace = true
publish = false
description = "Shell discovery for archon-cli: resolves the program and command flag used to run a generated shell command. Deliberately a leaf — no archon-* dependencies — so both the CLI surface and archon-workflow can depend on it without creating a cycle through archon-core."

# Dependency discipline: every dep MUST come from [workspace.dependencies].
[dependencies]
# PATH lookup without spawning a process. Replaces the previous `where git`
# subprocess in src/command/posix_shell.rs, which cost a process launch per
# resolution for information `which` reads straight off PATH.
which.workspace = true
# Issue-227: the OS write boundary under a bounded child (`write_boundary`):
# Landlock's raw syscalls on Linux, and the log line a caller without one
# leaves.
libc.workspace = true
tracing.workspace = true

# Issues 242/273: a Job Object the caller owns, so it can terminate the job
# and confirm it is empty (`job_object`); process-wrap keeps its own private.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    # Issue 342: `SYNCHRONIZE`, so `process_liveness` can wait on a process.
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Builds fake Git-for-Windows install trees so shell discovery precedence is
# testable on any platform, including from a Linux CI runner.
tempfile.workspace = true
# Issue 342: `LiveChild`, a real process the liveness tests start and end.
# archon-test-support has no path back to this crate, so no cycle forms.
archon-test-support = { path = "../archon-test-support" }
