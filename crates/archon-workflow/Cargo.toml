[package]
name = "archon-workflow"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
archon-llm = { path = "../archon-llm" }
# `lower_workflow` lowers a `WorkflowSpec` into the topology IR. The edge runs
# this way round because `WorkflowSpec` is this crate's type: siting the lowering
# next to the IR instead would mean `archon-topology -> archon-workflow` and
# close the `archon-core -> archon-workflow -> archon-topology -> archon-core`
# cycle. `default-features = false` because only the IR and its analyses are
# needed here — not the trace, and not the live admission layer.
archon-topology = { path = "../archon-topology", default-features = false }
# The write coordinator's resource keys and overlap table. Extracted to a leaf
# crate because `archon-topology`'s live admission has to reach the same table,
# and reaching it through this crate closed a dependency cycle. Re-exported from
# `write_coordinator` so every existing call site keeps its path.
archon-write-plan = { path = "../archon-write-plan" }
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
fd-lock.workspace = true
futures-util.workspace = true
glob.workspace = true
hex.workspace = true
libc = "0.2"
regex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
# The workflow-live JSON fixture corpus. `include_str!` resolves relative to the
# source file, so a fixture shared by a cluster that moved here and one that
# stayed in the binary can follow neither; the corpus therefore has one home in
# archon-test-support and every consumer names a `const`. Nothing in this crate
# read a fixture until the generated-contract cluster arrived.
#
# Dev-only deliberately: pulling it in at build time would put wiremock and the
# mock doubles into this crate's production dependency graph.
archon-test-support = { path = "../archon-test-support" }
tempfile.workspace = true
