[package]
name = "archon-cognitive"
version.workspace = true
edition.workspace = true

[dependencies]
# Issues 340, 342: every child is built through `archon_shell::spawn`, and
# the shared pid liveness probe lives there.
archon-shell = { path = "../archon-shell" }
blake3.workspace = true
chrono.workspace = true
cozo.workspace = true
archon-cozo = { path = "../archon-cozo" }
archon-reasoning-quality = { path = "../archon-reasoning-quality" }
archon-policy = { path = "../archon-policy" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
tempfile.workspace = true

[dev-dependencies]
toml.workspace = true
# Issue 342: `LiveChild`, a real process the daemon lock tests hold a lock with.
archon-test-support = { path = "../archon-test-support" }
