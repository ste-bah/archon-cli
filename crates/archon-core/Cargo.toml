[package]
name = "archon-core"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal dependencies
archon-llm = { path = "../archon-llm" }
archon-tools = { path = "../archon-tools" }
archon-permissions = { path = "../archon-permissions" }
archon-context = { path = "../archon-context" }
archon-session = { path = "../archon-session" }
archon-completion = { path = "../archon-completion" }
archon-consciousness = { path = "../archon-consciousness" }
archon-cognitive = { path = "../archon-cognitive" }
archon-memory = { path = "../archon-memory" }
archon-world-model = { path = "../archon-world-model" }
archon-leann = { path = "../archon-leann" }
# TASK-AGS-OBS-901: `src/metrics.rs` now re-exports `ChannelMetricSink` from
# archon-observability (trait was moved there in OBS-901 so the trait + type
# + impl all live in one crate — orphan-rule constraint). No cycle:
# archon-observability has zero archon-* deps.
archon-observability = { path = "../archon-observability" }
# Topology IR + graph analyses. `default-features = false` deliberately: the
# `workflow` feature would drag archon-workflow (22k LOC) into archon-core's
# build graph, and archon-core needs only the IR and the analyses. The
# Vec<Subtask> lowering lives here (orchestrator::topology) rather than in
# archon-topology so the dependency edge points core → topology, never back.
archon-topology = { path = "../archon-topology", default-features = false }
# Shell discovery for the hook process executor. A leaf with zero archon-*
# deps, so both archon-core and archon-workflow can hold this edge — which is
# the point: the two used to resolve a shell independently and disagree on
# Windows.
archon-shell = { path = "../archon-shell" }

# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
dirs.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
reqwest.workspace = true
sha2.workspace = true
semver.workspace = true
hex.workspace = true
async-trait.workspace = true
# #201 Phase 2: the ssh/openshell remote filesystems move file payloads over
# the command transport as base64, so stray output from a remote login profile
# fails the decode instead of silently corrupting the file.
base64.workspace = true
# TASK-AGS-101: tokio-util used for CancellationToken wiring that
# crosses archon-core boundaries. (dashmap + once_cell were moved to
# archon-tools in TASK-AGS-104 along with the background_agents module.)
tokio-util.workspace = true
process-wrap.workspace = true
libc = "0.2"
dashmap.workspace = true
tokio-stream.workspace = true
russh.workspace = true
axum.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
futures-util.workspace = true
url.workspace = true
rand.workspace = true
petgraph.workspace = true
wasmtime.workspace = true
inventory.workspace = true

jsonschema.workspace = true
sqlite.workspace = true
crc32fast.workspace = true
sysinfo.workspace = true
which.workspace = true

# Phase 3: Agent discovery system (TASK-AGS-300..307)
arc-swap.workspace = true
walkdir.workspace = true
ignore.workspace = true
moka.workspace = true
strsim.workspace = true
globset.workspace = true
rayon.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
archon-session = { path = "../archon-session", features = ["test-support"] }
archon-tools = { path = "../archon-tools", features = ["test-support"] }
archon-permissions = { path = "../archon-permissions" }
# #201 Phase 6: the docker-world integration test opens the terminal the backend
# describes, which needs a real PTY. Dev-only — archon-core never spawns one.
archon-pty = { path = "../archon-pty" }
# TASK-AGS-506: test-util feature needed for tokio::time::pause/advance in
# circuit_breaker tests. This only affects test builds.
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true
tempfile.workspace = true
toml.workspace = true
# TASK-AGS-009: PRESERVE-D5 regression guard uses serial_test to
# serialise the ARCHON_AUTO_BACKGROUND_TASKS env var flip test.
serial_test.workspace = true
# TASK-AGS-014: insta + archon-test-support drive the TUI frame
# snapshot baseline test (crates/archon-core/tests/tui_frame_baseline.rs).
# Both are dev-only — neither leaks into the production graph.
insta.workspace = true
archon-test-support = { path = "../archon-test-support" }
# Phase 3: wiremock for remote discovery integration tests (TASK-AGS-304)
wiremock.workspace = true
wat.workspace = true
tracing-test.workspace = true
# Issues #80/#81: the live-turn cognitive tests read the cognitive relations
# back through a separate handle, which is the source-of-truth read the
# completion standard asks for. Dev-only; archon-core links Cozo only through
# archon-cognitive in the production graph.
cozo.workspace = true
