[package]
name = "archon-tools"
version.workspace = true
edition.workspace = true

[dependencies]
archon-permissions = { path = "../archon-permissions" }
# Bash discovery for the Bash tool. A leaf crate — archon-core's hook executor
# already depends on it — so this adds no cycle, and it means the tool and the
# hooks resolve the same shell by the same rules (#118).
archon-shell = { path = "../archon-shell" }
archon-memory = { path = "../archon-memory" }
archon-leann = { path = "../archon-leann" }
archon-observability = { path = "../archon-observability" }
archon-docs = { path = "../archon-docs" }
archon-policy = { path = "../archon-policy" }
archon-completion = { path = "../archon-completion" }
archon-session = { path = "../archon-session" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
cozo.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
glob.workspace = true
regex.workspace = true
reqwest.workspace = true
futures-util.workspace = true
chrono.workspace = true
rand.workspace = true
cron.workspace = true
uuid.workspace = true
git2.workspace = true
dirs.workspace = true
async-lsp.workspace = true
lsp-types.workspace = true
tokio-util.workspace = true
process-wrap.workspace = true
# TASK-AGS-104: background_agents registry relocated here from
# archon-core to break the archon-core <-> archon-tools cycle.
dashmap.workspace = true
once_cell.workspace = true
tower.workspace = true
which.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
quick-xml.workspace = true
petgraph.workspace = true
libc = "0.2"
sha2.workspace = true

[dev-dependencies]
archon-session = { path = "../archon-session", features = ["test-support"] }
tempfile.workspace = true
# TASK-AGS-105: serialize tests that rely on process-global
# subagent executor state installed via OnceLock.
serial_test.workspace = true

[features]
# Test-only support consumed by cross-crate fault-injection tests.
test-support = []
# Declared so the feature-gated remote_trigger_tests target compiles under
# clippy --all-targets; the tests only run with --features remote-trigger.
remote-trigger = []
