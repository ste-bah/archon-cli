[package]
name = "archon-world-model"
version.workspace = true
edition.workspace = true
publish = false

[features]
# candle-core/candle-nn are pure-Rust CPU tensor + autodiff crates with no
# system dependencies; `cuda` and `mlx-metal` remain opt-in. Making this the
# default is what gives the shipped build gradients at all — without it every
# encoder path is frozen and `max_epochs`/`learning_rate` cannot be honoured.
# `--no-default-features` still yields the lean, training-free build.
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-nn"]
cuda = ["candle", "candle-core/cuda"]
mlx-metal = ["dep:mlx-rs"]

[dependencies]
anyhow.workspace = true
archon-completion = { path = "../archon-completion" }
archon-permissions = { path = "../archon-permissions" }
archon-llm = { path = "../archon-llm" }
archon-memory = { path = "../archon-memory" }
libc = "0.2"
tracing.workspace = true
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
chrono.workspace = true
cozo.workspace = true
fd-lock.workspace = true
archon-cozo = { path = "../archon-cozo" }
hex.workspace = true
regex.workspace = true
safetensors = "0.7.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "=0.25.3", optional = true }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio.workspace = true
