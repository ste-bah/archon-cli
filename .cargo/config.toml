# Cargo workspace configuration.
#
# Windows main-thread stack size (#234):
#   The default Windows main-thread stack is 1 MB, vs ~8 MB on Linux/macOS.
#   The archon binary's tokio + ratatui runtime initialization exceeds 1 MB
#   on Windows, causing a stack overflow during early init in the spawned
#   binary. This crashes 27 cli-workspace integration tests that spawn
#   `archon` and assert on its stderr (the SUT crashes before emitting the
#   expected log lines). Bumping the binary's main-thread stack to 8 MB
#   matches the Linux/macOS default and unblocks those tests.
#
#   This is the standard mitigation. Root-cause investigation (which
#   specific code path consumes >1 MB of stack on Windows during init) is
#   tracked separately as #235 and is non-blocking.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

# NASM-free Windows builds:
#   `aws-lc-sys` assembles its crypto primitives with NASM, which is not part
#   of any default Windows toolchain. Without it every cargo command in the
#   workspace dies in the build script with "NASM command not found! Build
#   cannot continue." — not just TLS-facing crates, because reqwest's
#   `rustls-tls` feature pulls rustls 0.23, which defaults to the aws-lc-rs
#   backend.
#
#   This flag tells aws-lc-sys to link the prebuilt NASM object files shipped
#   inside the crate instead of assembling them locally. Only its Windows-MSVC
#   build path reads the variable, so it is inert on Linux and macOS runners.
#
#   `force` is left at its default of false, so a developer or CI job that
#   installs NASM and exports the variable themselves still wins. If you need
#   the assembly built from source rather than trusting the bundled objects,
#   install NASM (`winget install --id NASM.NASM -e`), put it on PATH, and set
#   AWS_LC_SYS_PREBUILT_NASM=0 in your environment.
[env]
AWS_LC_SYS_PREBUILT_NASM = "1"

# Bundled RocksDB on current Linux compilers (#485):
#   rust-librocksdb-sys 0.30.0+9.8.4 (RocksDB 9.8.4) uses uint64_t in
#   db/blob/blob_file_meta.h and include/rocksdb/trace_record.h without
#   including <cstdint>. Newer GCC/libstdc++ (Ubuntu 26.04, the current
#   ubuntu-latest) no longer pulls it in transitively, so the C++ build fails
#   with "'uint64_t' has not been declared". RocksDB fixed the headers in
#   10.4.2 (rust-rocksdb 0.42.0), but cozo-ce pins rust-rocksdb ^0.34.0 and
#   the -sys crate `links = "rocksdb"`, so only one version can be linked.
#   Until that pin moves, force-include <cstdint> for C++ on Linux targets
#   only. cc-rs reads these per-target variables; macOS (libc++) and Windows
#   (MSVC) builds are untouched. An exported CXXFLAGS_<target> still wins.
CXXFLAGS_x86_64_unknown_linux_gnu = "-include cstdint"
CXXFLAGS_aarch64_unknown_linux_gnu = "-include cstdint"
