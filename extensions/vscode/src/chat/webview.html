<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archon Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: var(--vscode-font-family, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground, #ccc);
      background: var(--vscode-editor-background, #1e1e1e);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 90%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--vscode-editor-selectionBackground, #264f78);
      color: var(--vscode-foreground, #ccc);
    }

    .message.system {
      align-self: center;
      font-style: italic;
      opacity: 0.7;
      font-size: 0.9em;
    }

    .message.thinking {
      align-self: flex-start;
      font-style: italic;
      opacity: 0.7;
      border-left: 2px solid var(--vscode-panel-border, #3c3c3c);
    }

    .message.tool {
      align-self: stretch;
      max-width: 100%;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.9em;
      background: var(--vscode-textCodeBlock-background, #1b1b1b);
      border-left: 3px solid var(--vscode-panel-border, #3c3c3c);
    }

    .message.tool.error {
      border-left-color: var(--vscode-errorForeground, #f14c4c);
    }

    .tool-name {
      font-weight: 600;
      opacity: 0.9;
    }

    .tool-output {
      margin-top: 4px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #permission {
      display: none;
      margin: 0 12px 10px;
      padding: 10px 12px;
      border: 1px solid var(--vscode-inputValidation-warningBorder, #b89500);
      border-radius: 6px;
      background: var(--vscode-inputValidation-warningBackground, #352a05);
    }

    #permission.visible {
      display: block;
    }

    #permission-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    #permission-description {
      opacity: 0.9;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .permission-actions {
      display: flex;
      gap: 8px;
    }

    .permission-actions button {
      border: none;
      border-radius: 4px;
      padding: 5px 14px;
      cursor: pointer;
      font-size: inherit;
      font-family: inherit;
    }

    #permission-allow {
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
    }

    #permission-deny {
      background: var(--vscode-button-secondaryBackground, #3a3d41);
      color: var(--vscode-button-secondaryForeground, #fff);
    }

    #streaming {
      padding: 8px 12px;
      min-height: 24px;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0.85;
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
      background: var(--vscode-sideBar-background, #252526);
    }

    form {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    textarea {
      flex: 1;
      resize: none;
      background: var(--vscode-input-background, #3c3c3c);
      color: var(--vscode-input-foreground, #ccc);
      border: 1px solid var(--vscode-input-border, #555);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: inherit;
      line-height: 1.4;
      min-height: 36px;
      max-height: 120px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--vscode-focusBorder, #007fd4);
    }

    input[type="submit"] {
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: inherit;
      align-self: flex-end;
    }

    input[type="submit"]:hover {
      background: var(--vscode-button-hoverBackground, #1177bb);
    }

    input[type="submit"]:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="messages"></div>
  <div id="streaming"></div>
  <div id="permission" role="alertdialog" aria-live="assertive">
    <div id="permission-title"></div>
    <div id="permission-description"></div>
    <div class="permission-actions">
      <button type="button" id="permission-allow">Allow</button>
      <button type="button" id="permission-deny">Deny</button>
    </div>
  </div>
  <div id="input-area">
    <form id="chat-form">
      <textarea
        id="user-input"
        placeholder="Ask Archon anything… (Enter to send, Shift+Enter for newline)"
        rows="1"
      ></textarea>
      <input type="submit" id="send-btn" value="Send" />
      <button type="button" id="cancel-btn" hidden>Stop</button>
    </form>
  </div>

  <script>
    // @ts-check
    /* global acquireVsCodeApi */
    const vscode = acquireVsCodeApi();

    const messagesDiv = document.getElementById('messages');
    const streamingDiv = document.getElementById('streaming');
    const form = document.getElementById('chat-form');
    const textarea = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const permissionBox = document.getElementById('permission');
    const permissionTitle = document.getElementById('permission-title');
    const permissionDescription = document.getElementById('permission-description');
    const allowBtn = document.getElementById('permission-allow');
    const denyBtn = document.getElementById('permission-deny');

    let streamBuffer = '';
    let thinkingBuffer = '';
    let isBusy = false;
    // The request the buttons currently speak for. Cleared the moment a
    // decision is sent so a second click cannot answer a question that is
    // already closed.
    let pendingPermissionId = null;
    // Tool calls awaiting their result, keyed by toolUseId.
    const openTools = new Map();

    function appendMessage(role, content) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.textContent = content;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    function flushThinking() {
      if (thinkingBuffer.length > 0) {
        appendMessage('thinking', thinkingBuffer);
        thinkingBuffer = '';
      }
    }

    function flushAssistant() {
      if (streamBuffer.length > 0) {
        appendMessage('assistant', streamBuffer);
        streamBuffer = '';
      }
      setStreaming('');
    }

    function setStreaming(text) {
      streamingDiv.textContent = text;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function setBusy(busy) {
      isBusy = busy;
      textarea.disabled = busy;
      sendBtn.disabled = busy;
      cancelBtn.hidden = !busy;
    }

    function showPermission(msg) {
      pendingPermissionId = msg.requestId;
      permissionTitle.textContent = 'Allow Archon to run ' + msg.action + '?';
      permissionDescription.textContent = msg.description || '';
      permissionBox.classList.add('visible');
      allowBtn.disabled = false;
      denyBtn.disabled = false;
      allowBtn.focus();
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hidePermission() {
      pendingPermissionId = null;
      permissionBox.classList.remove('visible');
    }

    function decide(approved) {
      if (pendingPermissionId === null) return;
      const requestId = pendingPermissionId;
      // Cleared before posting: the host round-trips to the backend, and a
      // second click in the meantime would be a second answer to one question.
      hidePermission();
      vscode.postMessage({ type: 'permissionDecision', requestId, approved });
    }

    allowBtn.addEventListener('click', () => decide(true));
    denyBtn.addEventListener('click', () => decide(false));
    cancelBtn.addEventListener('click', () => vscode.postMessage({ type: 'cancel' }));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = textarea.value.trim();
      if (!text || isBusy) return;

      appendMessage('user', text);
      textarea.value = '';
      setBusy(true);
      streamBuffer = '';
      thinkingBuffer = '';
      openTools.clear();

      vscode.postMessage({ type: 'prompt', text });
    });

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    // Messages from the extension host
    window.addEventListener('message', (event) => {
      const msg = event.data;
      switch (msg.type) {
        case 'textDelta':
          flushThinking();
          streamBuffer += msg.text;
          setStreaming(streamBuffer);
          break;

        case 'thinkingDelta':
          thinkingBuffer += msg.text;
          setStreaming(streamBuffer);
          break;

        case 'toolCall': {
          flushThinking();
          flushAssistant();
          const div = appendMessage('tool', '');
          const name = document.createElement('div');
          name.className = 'tool-name';
          name.textContent = '\u2699 ' + msg.name + ' \u2026';
          div.appendChild(name);
          openTools.set(msg.toolUseId, { div, name });
          break;
        }

        case 'toolResult': {
          const open = openTools.get(msg.toolUseId);
          const div = open ? open.div : appendMessage('tool', '');
          if (open) {
            open.name.textContent = (msg.isError ? '\u2717 ' : '\u2713 ') + msg.name;
          } else {
            const name = document.createElement('div');
            name.className = 'tool-name';
            name.textContent = (msg.isError ? '\u2717 ' : '\u2713 ') + msg.name;
            div.appendChild(name);
          }
          if (msg.isError) div.classList.add('error');
          const out = document.createElement('div');
          out.className = 'tool-output';
          out.textContent = msg.content || '';
          div.appendChild(out);
          openTools.delete(msg.toolUseId);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          break;
        }

        case 'permissionRequest':
          showPermission(msg);
          break;

        case 'permissionResolved':
          // The agent has stopped waiting, whoever decided it. Take the
          // buttons down even if this client is not the one that answered.
          hidePermission();
          appendMessage(
            'system',
            (msg.granted ? '\u2713 Allowed ' : '\u2717 Denied ') +
              msg.action +
              (msg.reason ? ' \u2014 ' + msg.reason : '')
          );
          break;

        case 'turnComplete':
          flushThinking();
          flushAssistant();
          hidePermission();
          setBusy(false);
          break;

        case 'systemMessage':
          appendMessage('system', msg.text);
          break;

        case 'error':
          flushThinking();
          flushAssistant();
          hidePermission();
          appendMessage('system', '\u26a0 ' + msg.message);
          setBusy(false);
          break;
      }
    });
  </script>
</body>
</html>
