# Pinned deliberately rather than tracking `stable`.
#
# scripts/ci-gate.sh runs `cargo fmt --check` and `cargo clippy -- -D warnings`.
# Both are style gates whose output changes when the toolchain moves, so an
# unpinned channel turns every rustfmt or clippy release into a spurious red
# gate plus a churn commit — which is what happened to the eleven files
# reformatted in the preceding commit.
#
# Bump this intentionally: change the version, run `cargo fmt --all` and
# `cargo clippy --workspace --all-targets`, and land the result as its own
# commit. CI installs via dtolnay/rust-toolchain@stable, but rustup honours
# this file, so the pin wins there too.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
